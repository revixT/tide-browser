<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data:">
<link rel="stylesheet" href="../theme.css">
<title>Tide</title>
<style>
  :root { --spring: cubic-bezier(.34,1.56,.64,1); --expo: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; font: 13px "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #card { margin: 6px 10px 12px; padding: 16px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 0 24px rgb(var(--glow-rgb) / calc(.28 * var(--fx))), 0 20px 44px rgb(var(--shadow-rgb) / calc(.75 * var(--shadow-k))); animation: in .45s var(--expo); transform-origin: 100% 0; }
  @keyframes in { from { opacity: 0; transform: translateY(-10px) scale(.94); filter: blur(5px); } }
  h1 { font-size: 15px; font-weight: 500; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  h1 svg { width: 18px; height: 18px; color: var(--accent); flex: none; }
  p { margin: 4px 0 12px; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .site { color: var(--accent-soft); word-break: break-all; }
  input { width: 100%; height: 36px; margin-bottom: 8px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text-strong); padding: 0 12px; outline: 0; font-size: 14px; user-select: text; transition: border-color .3s, box-shadow .3s; }
  input:focus { border-color: rgb(var(--glow-rgb) / .8); box-shadow: 0 0 14px rgb(var(--glow-rgb) / calc(.35 * var(--fx))); }
  .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; flex-wrap: wrap; }
  button { height: 32px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font: inherit; transition: transform .3s var(--spring), box-shadow .3s, border-color .3s, background .3s; }
  button:hover { transform: translateY(-1px); border-color: rgb(var(--glow-rgb) / .7); box-shadow: 0 0 12px rgb(var(--glow-rgb) / calc(.3 * var(--fx))); }
  button:active { transform: scale(.95); }
  button.p { background: var(--accent-bg); border-color: var(--accent-line); color: var(--on-accent); }
  button.q { border-color: transparent; background: none; color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  .err { color: var(--bad); font-size: 12px; min-height: 16px; margin-bottom: 2px; }
  .meter { height: 4px; border-radius: 2px; background: var(--track); overflow: hidden; margin: -2px 0 8px; }
  .meter i { display: block; height: 100%; width: 0; background: var(--bad); transition: width .35s var(--expo), background .35s; }
  .hint { font-size: 11px; color: var(--muted); margin: -2px 0 8px; min-height: 14px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 12px; cursor: pointer; transition: background .25s, transform .3s var(--spring); animation: rowIn .4s var(--expo) backwards; animation-delay: calc(var(--i) * 40ms); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(8px); } }
  .item:hover { background: rgb(var(--glow-rgb) / .14); transform: translateX(3px); }
  .item .u { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .go { font-size: 11px; color: var(--accent); border: 1px solid var(--border); border-radius: 9px; padding: 1px 8px; }
  .dots { letter-spacing: 2px; color: var(--accent-soft); }
  .grade { margin-left: auto; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; border: 1px solid currentColor; }
  .gA, .gB { color: var(--ok); } .gC { color: var(--warn); } .gD, .gF { color: var(--bad); }
  .kv { display: flex; align-items: center; gap: 10px; padding: 7px 4px; font-size: 13px; border-bottom: 1px solid var(--line); }
  .kv .k { flex: 1; color: var(--muted); } .kv .v.ok { color: var(--ok); } .kv .v.bad { color: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 6px 4px; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 9px; background: rgb(var(--ov) / .06); color: var(--muted); }
  .sub { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); padding: 10px 4px 2px; }
  .mini { height: 22px; padding: 0 7px; font-size: 11px; border-radius: 11px; }
  .swrow { display: flex; align-items: center; gap: 10px; padding: 12px 4px 4px; cursor: pointer; font-size: 13px; }
  .swrow input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  button.danger { border-color: rgb(var(--bad-rgb) / .6); color: var(--bad); background: rgb(var(--bad-rgb) / .12); }
  .note { font-size: 11px; margin: 8px 0 0; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
</style>
</head>
<body>
  <div id="card"></div>
  <script src="popover.js"></script>
</body>
</html>
