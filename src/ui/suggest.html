<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data:">
<link rel="stylesheet" href="../theme.css">
<title>Suggestions</title>
<style>
  :root { --spring: cubic-bezier(.34,1.56,.64,1); --expo: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
    font: 14px "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #box { position: relative; margin: 6px 14px 20px; padding: 8px; border-radius: 16px; background: var(--surface);
    border: 1px solid var(--border); box-shadow: 0 0 24px rgb(var(--glow-rgb) / calc(.28 * var(--fx))), 0 20px 44px rgb(var(--shadow-rgb) / calc(.75 * var(--shadow-k)));
    transform-origin: 50% 0; opacity: 0; pointer-events: none; }
  #box.in { opacity: 1; pointer-events: auto; animation: boxIn .45s var(--expo); }
  #box.out { animation: boxOut .18s ease-in forwards; }
  @keyframes boxIn { from { opacity: 0; transform: translateY(-10px) scaleY(.88); filter: blur(5px); } }
  @keyframes boxOut { to { opacity: 0; transform: translateY(-6px) scaleY(.94); } }

  #hl { position: absolute; left: 8px; right: 8px; top: 8px; height: 44px; border-radius: 14px; pointer-events: none; opacity: 0;
    background: rgb(var(--ov) / .07);
    box-shadow: inset 0 0 0 1px rgb(var(--glow-rgb) / calc(.28 * var(--fx))), 0 0 16px rgb(var(--glow-rgb) / calc(.25 * var(--fx)));
    transition: transform .4s var(--spring), opacity .25s; }
  #hl::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--accent-soft); box-shadow: none; }

  .row { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; height: 44px; padding: 0 14px; border-radius: 14px; cursor: pointer; }
  .row.enter { animation: rowIn .45s var(--expo) backwards; animation-delay: calc(var(--i) * 30ms); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(10px) scale(.97); } }
  .ic { width: 20px; height: 20px; flex: none; color: var(--muted); transition: color .25s, transform .4s var(--spring); }
  .row.on .ic { color: var(--accent-soft); transform: scale(1.15); }
  .ic svg { width: 100%; height: 100%; display: block; }
  .txt { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
  .title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 70%; }
  .sub { color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .hint { font-size: 11px; color: var(--accent); border: 1px solid rgb(var(--glow-rgb) / .35); border-radius: 10px; padding: 2px 8px; flex: none; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
</style>
</head>
<body>
  <div id="box"><div id="hl"></div></div>
  <script src="suggest.js"></script>
</body>
</html>
