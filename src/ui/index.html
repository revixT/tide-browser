<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../theme.css">
<title>Tide UI</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8fa8ff"/></linearGradient>
    <symbol id="i-tide" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9.6"/><path d="M2.6 10.4q2.35-2.4 4.7 0t4.7 0t4.7 0t4.7 0"/><path d="M4 15.4q2.1 2.1 4.2 0t4.2 0t4.2 0t3.4 0"/></g></symbol>
    <symbol id="i-spark"viewBox="0 0 24 24"><path d="M12 1.5c.7 5.6 3 8.6 9 10.5-6 1.9-8.3 4.9-9 10.5-.7-5.6-3-8.6-9-10.5 6-1.9 8.3-4.9 9-10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 11L12 3.5 20.5 11M5.5 9.5V20h5v-6h3v6h5V9.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M6.5 3.5h11v17L12 16.5l-5.5 4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5.2l3.2 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M4.5 19.5h15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8l1.6 2.2 2.7-.5.9 2.6 2.6.9-.5 2.7 2.2 1.6-2.2 1.6.5 2.7-2.6.9-.9 2.6-2.7-.5L12 21.2 10.4 19l-2.7.5-.9-2.6-2.6-.9.5-2.7L2.5 11.7 4.7 10l-.5-2.7 2.6-.9.9-2.6 2.7.5z"/></g></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 5.5L4.5 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M5 12h14M13 5.5l6.5 6.5-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5M19.5 4v4.5H15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 15.5L20.5 20.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3.5 8.5a2 2 0 0 1 2-2h2l1.3-2h6.4l1.3 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/></g></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></g></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.2M12 19v2.2M2.8 12H5M19 12h2.2M5.5 5.5l1.6 1.6M16.9 16.9l1.6 1.6M18.5 5.5l-1.6 1.6M7.1 16.9l-1.6 1.6"/></g></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4 8.4 8.4 0 1 0 20 14.2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5z"/><path d="M12 6.5V19.5"/></g></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="4"/><path d="M11 12.5L20 3.5M16 7.5l2.5 2.5M13.5 10l2 2"/></g></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></g></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M12 3.5l9 16H3z"/><path d="M12 10v4.5M12 17.2v.1"/></g></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7.5 2.7v5.6c0 4.6-3.1 8.2-7.5 9.7-4.4-1.5-7.5-5.1-7.5-9.7V5.7z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-speaker" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></g></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><path d="M9 3.5h6l-1 6 3 3.5H7l3-3.5z"/><path d="M12 13v7.5"/></g></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.2l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.5l6-.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="tabstrip">
  <button id="logo" title="Home"><svg><use href="#i-tide"/></svg></button>
  <div id="tabs"><div id="tab-glow"></div></div>
  <button id="new-tab" title="New tab (Ctrl+T)"><svg><use href="#i-plus"/></svg></button>
  <button id="focus-chip" title="Focus is on. Click to manage" hidden><i></i><span id="focus-time"></span></button>
  <div id="toast"></div>
</div>

<div id="toolbar">
  <button id="back" class="ib" title="Back (Alt+Left)" disabled><svg><use href="#i-back"/></svg></button>
  <button id="forward" class="ib" title="Forward (Alt+Right)" disabled><svg><use href="#i-fwd"/></svg></button>
  <button id="reload" class="ib" title="Reload (Ctrl+R)"><svg><use id="reload-use" href="#i-reload"/></svg></button>

  <div id="omnibox-wrap">
    <svg class="oi"><use id="site-use" href="#i-search"/></svg>
    <input id="omnibox" type="text" spellcheck="false" autocomplete="off" placeholder="Search or enter a link...">
    <button id="reader" title="Reader view (F9)" hidden><svg><use href="#i-book"/></svg></button>
    <button id="zoom-pill" title="Reset zoom" hidden></button>
    <button id="shield" title="Ad and tracker blocking"><svg><use href="#i-shield"/></svg><span id="shield-count"></span></button>
    <button id="star" title="Bookmark this page (Ctrl+D)"><svg><use href="#i-star"/></svg></button>
  </div>

  <button id="ai" class="ib" title="Ask AI"><svg><use href="#i-spark"/></svg></button>
  <button id="shot" class="ib" title="Take screenshot"><svg><use href="#i-camera"/></svg></button>
  <button id="dl" class="ib" title="Downloads"><svg><use href="#i-download"/></svg></button>
  <button id="key" class="ib" title="Saved logins (Ctrl+Shift+L)"><svg><use href="#i-key"/></svg><i id="key-dot"></i></button>
  <button id="menu" class="ib" title="Menu"><svg><use href="#i-dots"/></svg></button>
</div>

<div id="progress"></div>
<div id="bm-bar"></div>

<nav id="sidebar">
  <div id="side-glow"></div>
  <button data-page="home" title="Home"><svg><use href="#i-home"/></svg></button>
  <button data-page="bookmarks" title="Bookmarks"><svg><use href="#i-bookmark"/></svg></button>
  <button data-page="history" title="History"><svg><use href="#i-clock"/></svg></button>
  <button data-page="downloads" title="Downloads"><svg><use href="#i-download"/></svg></button>
  <button data-page="passwords" title="Passwords"><svg><use href="#i-key"/></svg></button>
  <button data-page="explore" title="Explore Tide"><svg><use href="#i-grid"/></svg></button>
  <div class="sep"></div>
  <button id="theme-btn" data-action="theme" title="Switch theme" aria-label="Switch between light and dark mode">
    <span class="ico sun"><svg><use href="#i-sun"/></svg></span><span class="ico moon"><svg><use href="#i-moon"/></svg></span>
  </button>
  <button data-page="settings" title="Settings"><svg><use href="#i-gear"/></svg></button>
</nav>

<div id="find-bar" hidden>
  <input id="find-input" type="text" placeholder="Find in page" spellcheck="false">
  <span id="find-count"></span>
  <button id="find-prev" title="Previous (Shift+Enter)">&#9650;</button>
  <button id="find-next" title="Next (Enter)">&#9660;</button>
  <button id="find-close" title="Close (Esc)"><svg><use href="#i-x"/></svg></button>
</div>

<script src="renderer.js"></script>
</body>
</html>
