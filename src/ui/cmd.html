<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data:">
<link rel="stylesheet" href="../theme.css">
<title>Command bar</title>
<style>
  :root { --spring: cubic-bezier(.34,1.56,.64,1); --expo: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; font: 14px "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #card { margin: 8px 14px 22px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 0 28px rgb(var(--glow-rgb) / calc(.3 * var(--fx))), 0 24px 54px rgb(var(--shadow-rgb) / calc(.75 * var(--shadow-k))); padding: 8px; animation: in .4s var(--expo); transform-origin: 50% 0; }
  @keyframes in { from { opacity: 0; transform: translateY(-14px) scale(.96); filter: blur(5px); } }
  #in { width: 100%; height: 50px; border: 0; outline: 0; background: transparent; color: var(--text-strong); font: 17px "Segoe UI", system-ui, sans-serif; padding: 0 16px; user-select: text; }
  #in::placeholder { color: var(--muted); }
  #sep { height: 1px; background: var(--line); margin: 0 8px 6px; }
  #list { position: relative; }
  #hl { position: absolute; left: 0; right: 0; top: 0; height: 46px; border-radius: 14px; pointer-events: none; opacity: 0;
    background: rgb(var(--ov) / .07); box-shadow: inset 0 0 0 1px rgb(var(--glow-rgb) / calc(.28 * var(--fx)));
    transition: transform .35s var(--spring), opacity .2s; }
  #hl::before { content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; background: var(--accent-soft); box-shadow: none; }
  .row { position: relative; z-index: 1; display: flex; align-items: center; gap: 14px; height: 46px; padding: 0 14px; border-radius: 14px; cursor: pointer; animation: rowIn .35s var(--expo) backwards; animation-delay: calc(var(--i) * 22ms); }
  @keyframes rowIn { from { opacity: 0; transform: translateY(8px); } }
  .ic { width: 20px; height: 20px; flex: none; color: var(--muted); transition: color .25s, transform .4s var(--spring); }
  .row.on .ic { color: var(--accent-soft); transform: scale(1.15); }
  .ic svg { width: 100%; height: 100%; display: block; }
  .t { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
  .t b { font-weight: 400; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 62%; }
  .t span { color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; flex: 1; }
  .tag { font-size: 11px; color: var(--accent); border: 1px solid rgb(var(--glow-rgb) / .35); border-radius: 10px; padding: 2px 8px; flex: none; }
  .empty { padding: 20px; color: var(--muted); text-align: center; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
</style>
</head>
<body>
  <div id="card">
    <input id="in" placeholder="Search tabs, history and Recall, or type a command" autocomplete="off" spellcheck="false">
    <div id="sep"></div>
    <div id="list"><div id="hl"></div></div>
  </div>
  <script src="cmd.js"></script>
</body>
</html>
