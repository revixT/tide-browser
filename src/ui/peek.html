<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src data:">
<link rel="stylesheet" href="../theme.css">
<title>Peek</title>
<style>
  :root { --spring: cubic-bezier(.34,1.56,.64,1); --expo: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font: 13px "Segoe UI", system-ui, sans-serif; color: var(--text); }
  #dim { position: fixed; inset: 0; background: rgb(var(--shadow-rgb) / calc(.5 * var(--shadow-k) + .08)); backdrop-filter: blur(3px); animation: fade .3s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  #card { position: absolute; border-radius: 18px; background: var(--surface); border: 1px solid var(--border);
    box-shadow: 0 0 30px rgb(var(--glow-rgb) / calc(.3 * var(--fx))), 0 30px 70px rgb(var(--shadow-rgb) / calc(.7 * var(--shadow-k))); animation: pop .42s var(--expo); transform-origin: 50% 40%; overflow: hidden; }
  @keyframes pop { from { opacity: 0; transform: scale(.9); filter: blur(4px); } }
  #bar { display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); }
  #info { flex: 1; min-width: 0; }
  #title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #url { color: var(--muted); font-size: 11px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  button { height: 30px; padding: 0 12px; border-radius: 15px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); cursor: pointer; font: inherit;
    transition: transform .3s var(--spring), box-shadow .3s, border-color .3s; }
  button:hover { transform: translateY(-1px); border-color: rgb(var(--glow-rgb) / .7); box-shadow: 0 0 12px rgb(var(--glow-rgb) / calc(.3 * var(--fx))); }
  button:active { transform: scale(.94); }
  button.p { background: var(--accent-bg); border-color: var(--accent-line); color: var(--on-accent); }
  button.i { width: 30px; padding: 0; font-size: 15px; }
  #load { position: absolute; left: 0; top: 0; height: 2px; width: 30%; background: linear-gradient(90deg, transparent, var(--accent), var(--accent-soft)); opacity: 0; box-shadow: none; }
  #load.on { opacity: 1; animation: comet 1.2s cubic-bezier(.45,0,.25,1) infinite; }
  @keyframes comet { from { left: -30%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
</style>
</head>
<body>
  <div id="dim"></div>
  <div id="card">
    <div id="load"></div>
    <div id="bar">
      <button class="i" id="back" title="Back">&#8592;</button>
      <button class="i" id="reload" title="Reload">&#8635;</button>
      <div id="info"><div id="title">Loading…</div><div id="url"></div></div>
      <button class="p" id="open">Open in tab</button>
      <button class="i" id="close" title="Close (Esc)">&#10005;</button>
    </div>
  </div>
  <script src="peek.js"></script>
</body>
</html>
