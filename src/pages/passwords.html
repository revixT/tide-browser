<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../theme.css">
<title>Passwords</title>
<link rel="stylesheet" href="shared.css">
<script src="common.js"></script>
<style>
  .center { min-height: calc(100vh - 80px); display: flex; align-items: center; justify-content: center; padding: 20px; }
  .panel { width: min(440px, 92vw); padding: 30px; border-radius: 22px; border: 1px solid rgb(var(--glow-rgb) / .3); background: var(--surface);
    box-shadow: 0 0 40px rgb(var(--glow-rgb) / calc(.16 * var(--fx))); animation: panelIn .8s var(--expo); }
  @keyframes panelIn { from { opacity: 0; transform: translateY(24px) scale(.96); filter: blur(6px); } }
  .panel .big { width: 54px; height: 54px; color: var(--accent); filter: drop-shadow(0 0 14px rgb(var(--glow-rgb) / calc(.7 * var(--fx)))); margin-bottom: 8px; }
  .panel h2 { font-size: 22px; font-weight: 500; margin: 6px 0 8px; text-transform: none; letter-spacing: 0; color: var(--text); }
  .panel p { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 6px 0 14px; }
  .panel input { width: 100%; margin-bottom: 10px; }
  .meter { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; margin: -2px 0 6px; }
  .meter i { display: block; height: 100%; width: 0; background: var(--bad); transition: width .4s var(--expo), background .4s; }
  .hint { font-size: 12px; color: var(--muted); min-height: 16px; margin-bottom: 8px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin: 2px 0 8px; }
  .okmsg { color: var(--ok); font-size: 13px; margin: 8px 0; }
  .btn.pri { background: var(--accent-bg); border-color: var(--accent-line); color: var(--on-accent); width: 100%; height: 42px; }
  .btn.pri:disabled { opacity: .5; }
  .btn.sm { height: 30px; padding: 0 12px; font-size: 12px; }
  .btn.danger { border-color: rgb(var(--bad-rgb) / .5); color: var(--bad); }
  .btn.danger.armed { background: rgb(var(--bad-rgb) / .2); box-shadow: 0 0 14px rgb(var(--bad-rgb) / .35); }
  .link { color: var(--muted); font-size: 12px; text-align: center; margin-top: 14px; cursor: pointer; text-decoration: underline; }

  .tabs { display: flex; gap: 6px; padding: 14px 40px 0; max-width: 980px; }
  .tabs button { height: 34px; padding: 0 18px; border-radius: 17px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; font: 13px "Segoe UI", system-ui, sans-serif; transition: background .25s, color .25s, transform .3s var(--spring); }
  .tabs button:hover { background: rgb(var(--ov) / .06); color: var(--text-strong); }
  .tabs button.on { background: rgb(var(--ov) / .07); color: var(--text-strong); border-color: rgb(var(--glow-rgb) / .28); }
  .row { cursor: default; }
  .row .ava { width: 32px; height: 32px; border-radius: 50%; background: rgb(var(--glow-rgb) / .15); display: flex; align-items: center; justify-content: center; font-weight: 600; flex: none; color: var(--accent-soft); text-transform: uppercase; }
  .row .site { flex: 1; min-width: 0; }
  .row .site .s1 { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .site .s2 { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .acts { display: flex; gap: 6px; opacity: 0; transition: opacity .2s; flex: none; }
  .row:hover .acts, .row:focus-within .acts { opacity: 1; }
  .pwshow { font-family: ui-monospace, Consolas, monospace; color: var(--ok); }
  .stat { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
  .stat .c { flex: 1; min-width: 150px; padding: 16px 18px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); animation: rowIn .6s var(--expo) backwards; }
  .stat .c b { display: block; font-size: 28px; font-weight: 400; }
  .stat .c.bad b { color: var(--warn); } .stat .c.good b { color: var(--ok); }
  .stat .c span { color: var(--muted); font-size: 12px; }
  .card { border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; background: var(--surface); margin-top: 12px; animation: rowIn .6s var(--expo) backwards; }
  .card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 500; }
  .card p { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 4px 0 10px; }
  .card .line { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .card input[type=password], .card input[type=text] { height: 34px; }
  dialog { border: 1px solid rgb(var(--glow-rgb) / .5); border-radius: 18px; background: var(--surface); color: var(--text); padding: 22px; width: 420px; box-shadow: 0 0 30px rgb(var(--glow-rgb) / calc(.3 * var(--fx))); }
  dialog[open] { animation: dlgIn .5s var(--spring); }
  dialog::backdrop { background: rgb(var(--shadow-rgb) / calc(.65 * var(--shadow-k))); backdrop-filter: blur(4px); }
  @keyframes dlgIn { from { opacity: 0; transform: translateY(24px) scale(.9); filter: blur(6px); } }
  dialog h3 { margin: 0 0 14px; font-weight: 500; }
  dialog label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  dialog input, dialog textarea { width: 100%; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text-strong); padding: 9px 12px; font: 14px "Segoe UI", system-ui, sans-serif; outline: 0; }
  dialog input { height: 38px; padding-top: 0; padding-bottom: 0; }
  dialog textarea { height: 70px; resize: none; }
  dialog .pwrow { display: flex; gap: 6px; }
  dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  select { min-width: 160px; }
</style>
</head>
<body>
  <header class="bar">
    <h1>Passwords</h1>
    <input type="text" class="search" id="search" placeholder="Search passwords" autocomplete="off" style="display:none">
    <button class="btn" id="add" style="display:none">Add password</button>
    <button class="btn" id="lock" style="display:none">Lock</button>
  </header>
  <div id="tabs" class="tabs" style="display:none"></div>
  <main id="app"></main>

  <dialog id="dlg">
    <h3 id="dtitle">Add password</h3>
    <label>Website</label><input id="d-site" type="text" placeholder="https://example.com" autocomplete="off">
    <label>Username or email</label><input id="d-user" type="text" autocomplete="off">
    <label>Password</label>
    <div class="pwrow"><input id="d-pass" type="password" autocomplete="off"><button class="btn sm" id="d-show">Show</button><button class="btn sm" id="d-gen">Generate</button></div>
    <label>Notes</label><textarea id="d-notes"></textarea>
    <div class="err" id="d-err"></div>
    <div class="acts"><button class="btn" id="d-cancel">Cancel</button><button class="btn" id="d-save" style="background:var(--accent-bg);border-color:var(--accent-line);color:var(--on-accent)">Save</button></div>
  </dialog>

  <script>
    const api = window.tidePage;
    const $ = (id) => document.getElementById(id);
    const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const KEYSVG = '<svg class="big" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="4"/><path d="M11 12.5L20 3.5M16 7.5l2.5 2.5M13.5 10l2 2"/></g></svg>';
    const bits = (pw) => { let p = 0; if (/[a-z]/.test(pw)) p += 26; if (/[A-Z]/.test(pw)) p += 26; if (/\d/.test(pw)) p += 10; if (/[^A-Za-z0-9]/.test(pw)) p += 32; return pw.length * Math.log2(Math.max(p, 2)); };
    const hostOf = (o) => { try { return new URL(o).host; } catch { return o; } };
    const ago = (t) => { if (!t) return 'never'; const d = Math.round((Date.now() - t) / 864e5); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 60 ? `${d} days ago` : d < 730 ? `${Math.round(d / 30)} months ago` : `${Math.round(d / 365)} years ago`; };
    function armed(btn, label, fn) {
      let on = false, t;
      btn.onclick = () => {
        if (!on) { on = true; btn.dataset.l = btn.textContent; btn.textContent = label; btn.classList.add('armed'); t = setTimeout(() => { on = false; btn.textContent = btn.dataset.l; btn.classList.remove('armed'); }, 4000); return; }
        clearTimeout(t); on = false; btn.classList.remove('armed'); btn.textContent = btn.dataset.l; fn();
      };
    }

    let entries = [], tab = 'passwords', editing = null, pollTimer = null;
    const app = $('app');
    const setChrome = (managerOn) => {
      for (const id of ['search', 'add', 'lock']) $(id).style.display = managerOn ? '' : 'none';
      $('tabs').style.display = managerOn ? 'flex' : 'none';
    };

    // ---------- screens ----------
    async function boot() {
      clearInterval(pollTimer);
      const s = await api.pwStatus();
      if (!s.exists) return showCreate();
      if (!s.unlocked) return showLocked(s);
      return showManager();
    }

    function showCreate() {
      setChrome(false); app.textContent = '';
      const wrap = h('div', 'center'); const p = h('div', 'panel');
      p.innerHTML = KEYSVG;
      p.append(h('h2', '', 'Create your password vault'),
        h('p', '', 'Tide encrypts your saved passwords with a master password you choose. It is never stored or sent anywhere. If you forget it, nobody can recover your passwords, so pick something you will remember.'));
      const a = h('input'); a.type = 'password'; a.placeholder = 'Master password (10+ characters)'; a.autocomplete = 'off';
      const m = h('div', 'meter'); const bar = h('i'); m.appendChild(bar); const hint = h('div', 'hint');
      const b = h('input'); b.type = 'password'; b.placeholder = 'Repeat master password'; b.autocomplete = 'off';
      const err = h('div', 'err'); const go = h('button', 'btn pri', 'Create vault');
      a.oninput = () => { const v = bits(a.value); bar.style.width = Math.min(100, v / 80 * 100) + '%'; bar.style.background = v < 40 ? 'var(--bad)' : v < 60 ? 'var(--warn)' : 'var(--ok)'; hint.textContent = !a.value ? '' : v < 40 ? 'Too easy to guess. Try four random words.' : v < 60 ? 'Okay. A longer phrase is better.' : 'Strong.'; };
      go.onclick = async () => {
        if (a.value !== b.value) { err.textContent = 'The two passwords do not match.'; return; }
        go.disabled = true; err.textContent = '';
        const r = await api.pwCreate(a.value); go.disabled = false;
        if (!r.ok) err.textContent = r.error; else boot();
      };
      b.onkeydown = (e) => { if (e.key === 'Enter') go.click(); };
      p.append(a, m, hint, b, err, go); wrap.appendChild(p); app.appendChild(wrap); a.focus();
    }

    function showLocked(s) {
      setChrome(false); app.textContent = '';
      const wrap = h('div', 'center'); const p = h('div', 'panel');
      p.innerHTML = KEYSVG;
      p.append(h('h2', '', 'Your vault is locked'), h('p', '', 'Enter your master password to see and use your saved passwords.'));
      const a = h('input'); a.type = 'password'; a.placeholder = 'Master password'; a.autocomplete = 'off';
      const err = h('div', 'err'); const go = h('button', 'btn pri', 'Unlock');
      go.onclick = async () => {
        go.disabled = true; err.textContent = '';
        const r = await api.pwUnlock(a.value); go.disabled = false;
        if (r.ok) boot(); else { err.textContent = r.wait ? `${r.error} Try again in ${r.wait} seconds.` : r.error; a.select(); }
      };
      a.onkeydown = (e) => { if (e.key === 'Enter') go.click(); };
      const reset = h('div', 'link', 'Forgot your master password?');
      reset.onclick = () => {
        p.textContent = ''; p.innerHTML = KEYSVG;
        p.append(h('h2', '', 'Reset the vault'), h('p', '', 'There is no way to recover a forgotten master password. You can delete the vault and start over, which permanently deletes every saved password.'));
        const del = h('button', 'btn danger pri', 'Delete vault and start over'); const back = h('div', 'link', 'Go back');
        armed(del, 'Click again to delete everything', async () => { await api.pwReset(); boot(); });
        back.onclick = () => showLocked(s);
        p.append(del, back);
      };
      p.append(a, err, go, reset); wrap.appendChild(p); app.appendChild(wrap); a.focus();
      if (s.wait) err.textContent = `Too many attempts. Try again in ${s.wait} seconds.`;
    }

    // ---------- manager ----------
    async function showManager() {
      setChrome(true);
      const list = await api.pwList();
      if (!list) return boot();
      entries = list; renderTabs(); render(true);
      clearInterval(pollTimer);
      pollTimer = setInterval(async () => { const s = await api.pwStatus(); if (!s.unlocked) boot(); }, 4000); // auto-lock
    }

    function renderTabs() {
      const t = $('tabs'); t.textContent = '';
      for (const [id, label] of [['passwords', 'Passwords'], ['health', 'Security check'], ['tools', 'Tools']]) {
        const b = h('button', tab === id ? 'on' : '', label); b.onclick = () => { tab = id; renderTabs(); render(true); }; t.appendChild(b);
      }
    }

    function render(animate) {
      app.textContent = '';
      app.style.padding = '8px 40px 60px';
      if (tab === 'passwords') return renderList(animate);
      if (tab === 'health') return renderHealth();
      return renderTools();
    }

    function renderList(animate) {
      const box = h('div'); if (animate) box.className = 'animate';
      const q = $('search').value.trim().toLowerCase();
      const shown = entries.filter((e) => !q || e.origin.toLowerCase().includes(q) || e.username.toLowerCase().includes(q))
        .sort((a, b) => hostOf(a.origin).localeCompare(hostOf(b.origin)));
      if (!shown.length) {
        box.appendChild(h('div', 'empty', entries.length ? 'No matches.' : 'No saved passwords yet. Sign in to a site and Tide will offer to save it, or add one yourself.'));
        app.appendChild(box); return;
      }
      shown.forEach((e, i) => {
        const row = h('div', 'row'); row.style.setProperty('--i', i);
        row.appendChild(h('div', 'ava', hostOf(e.origin).replace(/^www\./, '')[0] || '?'));
        const site = h('div', 'site'); const s2 = h('div', 's2', `${e.username || '(no username)'}  ·  used ${ago(e.used)}`);
        site.append(h('div', 's1', hostOf(e.origin)), s2); row.appendChild(site);
        const acts = h('div', 'acts');
        const mk = (label, fn, cls = '') => { const b = h('button', 'btn sm ' + cls, label); b.onclick = (ev) => { ev.stopPropagation(); fn(b); }; return b; };
        let shownT;
        acts.append(
          mk('Copy username', async (b) => { await api.pwCopy(e.id, 'username'); flash(b, 'Copied'); }),
          mk('Copy password', async (b) => { await api.pwCopy(e.id, 'password'); flash(b, 'Copied. Clears in 30s'); }),
          mk('Show', async (b) => {
            if (shownT) { clearTimeout(shownT); s2.textContent = `${e.username || '(no username)'}  ·  used ${ago(e.used)}`; shownT = null; b.textContent = 'Show'; return; }
            const r = await api.pwReveal(e.id); if (!r) return boot();
            s2.textContent = ''; s2.appendChild(h('span', 'pwshow', r.password)); b.textContent = 'Hide';
            shownT = setTimeout(() => { s2.textContent = `${e.username || '(no username)'}  ·  used ${ago(e.used)}`; b.textContent = 'Show'; shownT = null; }, 10000);
          }),
          mk('Edit', () => openDialog(e)),
        );
        const del = mk('Delete', () => {}, 'danger'); armed(del, 'Confirm', async () => { await api.pwRemove(e.id); entries = entries.filter((x) => x.id !== e.id); render(false); });
        acts.appendChild(del); row.appendChild(acts); box.appendChild(row);
      });
      app.appendChild(box);
    }
    function flash(btn, text) { const old = btn.textContent; btn.textContent = text; setTimeout(() => { btn.textContent = old; }, 1600); }

    async function renderHealth() {
      const hh = await api.pwHealth(); if (!hh) return boot();
      const byId = new Map(entries.map((e) => [e.id, e]));
      const stat = h('div', 'stat'); let n = 0;
      const card = (label, count, bad) => { const c = h('div', 'c ' + (count ? (bad ? 'bad' : '') : 'good')); c.style.animationDelay = `${n++ * 60}ms`; c.append(h('b', '', String(count)), h('span', '', label)); return c; };
      stat.append(card('Saved passwords', hh.total, false), card('Reused passwords', hh.reused.length, true), card('Weak passwords', hh.weak.length, true), card('Not changed in a year', hh.old.length, true));
      app.appendChild(stat);
      const section = (title, ids, why) => {
        if (!ids.length) return;
        const c = h('div', 'card'); c.append(h('h3', '', title), h('p', '', why));
        for (const id of ids) { const e = byId.get(id); if (!e) continue; const li = h('div', 'row'); li.append(h('div', 'ava', hostOf(e.origin)[0] || '?'), Object.assign(h('div', 'site'), {})); li.lastChild.append(h('div', 's1', hostOf(e.origin)), h('div', 's2', e.username || '(no username)')); const b = h('button', 'btn sm', 'Edit'); b.onclick = () => openDialog(e); li.appendChild(b); c.appendChild(li); }
        app.appendChild(c);
      };
      section('Reused passwords', hh.reused, 'If one site leaks a password, attackers try it everywhere. Give each site its own.');
      section('Weak passwords', hh.weak, 'Short or predictable passwords can be guessed quickly. Use the Generate button when you edit one.');
      section('Old passwords', hh.old, 'These have not been changed in over a year.');
      const br = h('div', 'card'); br.append(h('h3', '', 'Check for breached passwords'),
        h('p', '', 'Compares your passwords against a public list of leaked passwords (Have I Been Pwned). Tide sends only the first 5 characters of a one-way hash of each password, so the service cannot tell which password you checked. Your passwords and sites are never sent.'));
      const go = h('button', 'btn', 'Check now'); const out = h('div'); br.append(go, out);
      go.onclick = async () => {
        go.disabled = true; go.textContent = 'Checking…'; out.textContent = '';
        const r = await api.pwBreachCheck(); go.disabled = false; go.textContent = 'Check now';
        if (r.error) { out.appendChild(h('div', 'err', r.error)); return; }
        if (!r.hits.length) { out.appendChild(h('div', 'okmsg', `None of your passwords appear in known leaks (${entries.length} checked).`)); return; }
        out.appendChild(h('div', 'err', `${r.hits.length} of your passwords appear in known leaks. Change them:`));
        for (const x of r.hits) { const e = byId.get(x.id); if (!e) continue; const li = h('div', 'li'); li.style.cssText = 'display:flex;gap:10px;padding:6px 0'; li.append(h('span', '', hostOf(e.origin)), h('span', 'muted', `${e.username || ''}  ·  seen ${x.count.toLocaleString()} times`)); out.appendChild(li); }
      };
      app.appendChild(br);
    }

    async function renderTools() {
      const s = await api.getSettings();
      const card = (title, text) => { const c = h('div', 'card'); c.append(h('h3', '', title)); if (text) c.appendChild(h('p', '', text)); app.appendChild(c); return c; };

      let c = card('Auto-lock', 'Lock the vault after this long without using it. It also locks when you lock Windows or close Tide.');
      const sel = h('select'); for (const [v, l] of [[1, '1 minute'], [5, '5 minutes'], [15, '15 minutes'], [30, '30 minutes'], [60, '1 hour'], [0, 'Never (not recommended)']]) { const o = h('option', '', l); o.value = v; sel.appendChild(o); }
      sel.value = String(s.pwAutoLockMin); sel.onchange = () => api.setSettings({ pwAutoLockMin: Number(sel.value) }); c.appendChild(sel);

      c = card('Offers to save', 'Control when Tide asks to save a password after you sign in.');
      const mkToggle = (label, key) => { const row = h('label'); row.style.cssText = 'display:flex;gap:10px;align-items:center;margin:6px 0;font-size:14px;cursor:pointer'; const i = h('input'); i.type = 'checkbox'; i.checked = !!s[key]; i.style.accentColor = 'var(--accent)'; i.onchange = () => api.setSettings({ [key]: i.checked }); row.append(i, document.createTextNode(label)); c.appendChild(row); };
      mkToggle('Offer to save passwords when I sign in', 'pwPrompts');
      const nv = h('button', 'btn sm', 'Forget the "never save" list'); nv.onclick = async () => { await api.pwClearNever(); flash(nv, 'Done'); }; c.appendChild(nv);

      c = card('Import passwords', 'Bring passwords from Chrome, Edge, Brave or Firefox. In that browser, export your passwords to a CSV file, then choose it here. Delete the CSV file afterwards, because it is not encrypted.');
      const imp = h('button', 'btn', 'Choose CSV file…'); const impOut = h('div'); c.append(imp, impOut);
      imp.onclick = async () => { impOut.textContent = ''; const r = await api.pwImport(); if (!r) return; if (r.error) { impOut.appendChild(h('div', 'err', r.error)); return; } impOut.appendChild(h('div', 'okmsg', `Added ${r.added}, updated ${r.updated}, skipped ${r.skipped}.`)); entries = (await api.pwList()) || entries; };

      c = card('Export passwords', 'Saves every password to a plain CSV file that anyone can read. Enter your master password to continue, and delete the file when you are done with it.');
      const line = h('div', 'line'); const ep = h('input'); ep.type = 'password'; ep.placeholder = 'Master password'; ep.autocomplete = 'off'; const eb = h('button', 'btn', 'Export…'); const eo = h('div');
      eb.onclick = async () => { eo.textContent = ''; const r = await api.pwExport(ep.value); ep.value = ''; if (r.ok) eo.appendChild(h('div', 'okmsg', 'Exported. Delete the file when you are done.')); else if (r.error) eo.appendChild(h('div', 'err', r.error)); };
      line.append(ep, eb); c.append(line, eo);

      c = card('Change master password', 'Re-encrypts your vault with a new master password.');
      const o = h('input'); o.type = 'password'; o.placeholder = 'Current master password'; const n1 = h('input'); n1.type = 'password'; n1.placeholder = 'New master password'; const n2 = h('input'); n2.type = 'password'; n2.placeholder = 'Repeat new master password';
      for (const i of [o, n1, n2]) { i.autocomplete = 'off'; i.style.cssText = 'display:block;margin:6px 0;width:min(320px,100%)'; }
      const cb = h('button', 'btn', 'Change'); const co = h('div');
      cb.onclick = async () => { co.textContent = ''; if (n1.value !== n2.value) { co.appendChild(h('div', 'err', 'The new passwords do not match.')); return; } cb.disabled = true; const r = await api.pwChangeMaster(o.value, n1.value); cb.disabled = false; if (r.ok) { co.appendChild(h('div', 'okmsg', 'Master password changed.')); o.value = n1.value = n2.value = ''; } else co.appendChild(h('div', 'err', r.error)); };
      c.append(o, n1, n2, cb, co);

      c = card('Delete vault', 'Permanently deletes every saved password and the vault file. This cannot be undone.');
      const del = h('button', 'btn danger', 'Delete vault'); armed(del, 'Click again to delete everything', async () => { await api.pwReset(); boot(); }); c.appendChild(del);
    }

    // ---------- add / edit dialog ----------
    function openDialog(e) {
      editing = e || null;
      $('dtitle').textContent = e ? 'Edit password' : 'Add password';
      $('d-site').value = e ? e.origin : ''; $('d-user').value = e ? e.username : ''; $('d-pass').value = ''; $('d-notes').value = ''; $('d-err').textContent = '';
      $('d-pass').type = 'password'; $('d-show').textContent = 'Show';
      $('dlg').showModal();
      if (e) api.pwReveal(e.id).then((r) => { if (r) { $('d-pass').value = r.password; $('d-notes').value = r.notes || ''; } });
      (e ? $('d-user') : $('d-site')).focus();
    }
    $('add').onclick = () => openDialog(null);
    $('d-cancel').onclick = () => $('dlg').close();
    $('d-show').onclick = () => { const p = $('d-pass'); p.type = p.type === 'password' ? 'text' : 'password'; $('d-show').textContent = p.type === 'password' ? 'Show' : 'Hide'; };
    $('d-gen').onclick = async () => { $('d-pass').value = await api.pwGenerate({ length: 20 }); $('d-pass').type = 'text'; $('d-show').textContent = 'Hide'; };
    $('d-save').onclick = async () => {
      let site = $('d-site').value.trim();
      if (site && !/^https?:\/\//i.test(site)) site = 'https://' + site;
      const r = await api.pwSave({ id: editing ? editing.id : undefined, origin: site, username: $('d-user').value, password: $('d-pass').value, notes: $('d-notes').value });
      if (!r.ok) { $('d-err').textContent = r.error; return; }
      $('dlg').close(); entries = (await api.pwList()) || entries; render(false);
    };

    $('search').oninput = () => { if (tab === 'passwords') render(false); };
    $('lock').onclick = async () => { await api.pwLock(); boot(); };
    boot();
  </script>
</body>
</html>
