<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../theme.css">
<title>Reader</title>
<script src="common.js"></script>
<style>
  :root { --spring: cubic-bezier(.34,1.56,.64,1); --expo: cubic-bezier(.16,1,.3,1); --fs: 19px; --w: 700px; --ff: "Segoe UI", system-ui, sans-serif; --lh: 1.75; --ls: 0; --ws: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
  #tools { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 24px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); animation: down .6s var(--expo); }
  @keyframes down { from { opacity: 0; transform: translateY(-14px); } }
  #tools .sp { width: 1px; height: 22px; background: var(--line); margin: 0 6px; }
  button, select { height: 32px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font: 13px "Segoe UI", system-ui, sans-serif; cursor: pointer; padding: 0 14px; transition: transform .3s var(--spring), border-color .25s, box-shadow .3s; }
  select { padding: 0 10px; max-width: 170px; }
  button:hover { transform: translateY(-1px); border-color: rgb(var(--glow-rgb) / .7); box-shadow: 0 0 12px rgb(var(--glow-rgb) / calc(.25 * var(--fx))); }
  button:active { transform: scale(.94); }
  button.i { width: 32px; padding: 0; }
  button.p { background: var(--accent-bg); border-color: var(--accent-line); color: var(--on-accent); }
  button:disabled { opacity: .4; cursor: default; transform: none; box-shadow: none; }
  article { max-width: var(--w); margin: 0 auto; padding: 36px 24px 120px; font: var(--fs)/var(--lh) var(--ff); letter-spacing: var(--ls); word-spacing: var(--ws); animation: rise .8s var(--expo); }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  article h1 { font-size: 2em; line-height: 1.2; margin: 0 0 8px; font-weight: 600; color: var(--text-strong); }
  .meta { color: var(--muted); font-size: .75em; margin-bottom: 30px; }
  article h2 { font-size: 1.45em; margin: 1.6em 0 .3em; color: var(--text-strong); }
  article h3 { font-size: 1.18em; margin: 1.3em 0 .2em; color: var(--text-strong); }
  article p { margin: 0 0 1.1em; }
  article blockquote { margin: 1.2em 0; padding: .2em 1.2em; border-left: 3px solid var(--accent); color: var(--muted); }
  article ul { padding-left: 1.4em; margin: 0 0 1.1em; }
  article pre { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow: auto; font: 14px ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  article img { max-width: 100%; border-radius: 12px; display: block; margin: 1.2em auto; }
  .s { border-radius: 4px; transition: background .25s, box-shadow .25s; cursor: pointer; }
  .s:hover { background: rgb(var(--ov) / .07); }
  .s.now { background: rgb(var(--glow-rgb) / .28); box-shadow: 0 0 0 3px rgb(var(--glow-rgb) / calc(.28 * var(--fx))); }
  #msg { max-width: 560px; margin: 80px auto; text-align: center; color: var(--muted); line-height: 1.6; padding: 0 24px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  html.reduce *, html.reduce *::before, html.reduce *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
</style>
</head>
<body>
  <div id="tools">
    <button id="back">&#8592; Back to page</button>
    <div class="sp"></div>
    <button class="i" id="sm" title="Smaller text">A&#8722;</button>
    <button class="i" id="lg" title="Larger text">A+</button>
    <select id="font" title="Font"><option value="sans">Sans</option><option value="serif">Serif</option><option value="easy">Easy read</option></select>
    <select id="width" title="Line width"><option value="560">Narrow</option><option value="700">Medium</option><option value="900">Wide</option></select>
    <div class="sp"></div>
    <button class="p" id="play">&#9654; Read aloud</button>
    <button class="i" id="stop" title="Stop" disabled>&#9632;</button>
    <select id="rate" title="Speed"><option value="0.8">0.8x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
    <select id="voice" title="Voice"></select>
  </div>
  <div id="msg" style="display:none"></div>
  <article id="art" style="display:none"><h1 id="ttl"></h1><div class="meta" id="meta"></div><div id="body"></div></article>
  <script>
    const api = window.tidePage;
    const $ = (id) => document.getElementById(id);
    const root = document.documentElement;
    let doc = null;
    const queue = [];
    const prefs = { fs: 19, font: 'sans', width: '700', rate: '1', voice: '' };
    try { Object.assign(prefs, JSON.parse(localStorage.getItem('tide-reader') || '{}')); } catch { /* storage unavailable */ }
    const savePrefs = () => { try { localStorage.setItem('tide-reader', JSON.stringify(prefs)); } catch { /* ignore */ } };

    function applyPrefs() {
      root.style.setProperty('--fs', `${prefs.fs}px`);
      root.style.setProperty('--w', `${prefs.width}px`);
      const F = { sans: ['"Segoe UI", system-ui, sans-serif', 1.75, '0', '0'], serif: ['Georgia, "Times New Roman", serif', 1.8, '0', '0'], easy: ['Verdana, Tahoma, sans-serif', 1.95, '0.04em', '0.14em'] }[prefs.font] || [];
      root.style.setProperty('--ff', F[0]); root.style.setProperty('--lh', F[1]); root.style.setProperty('--ls', F[2]); root.style.setProperty('--ws', F[3]);
      $('font').value = prefs.font; $('width').value = prefs.width; $('rate').value = prefs.rate;
    }

    function sentences(text) {
      const parts = String(text).match(/[^.!?]+(?:[.!?]+["')\]]*|$)\s*/g);
      return (parts || [text]).map((s) => s.trim()).filter(Boolean);
    }

    function build() {
      $('ttl').textContent = doc.title; document.title = doc.title;
      $('meta').textContent = [doc.byline, doc.site].filter(Boolean).join('  ·  ');
      const body = $('body');
      let ul = null;
      const addText = (el, text) => {
        sentences(text).forEach((s, i, all) => {
          const span = document.createElement('span'); span.className = 's'; span.textContent = s + (i < all.length - 1 ? ' ' : '');
          span.onclick = () => speakFrom(queue.indexOf(span));
          el.appendChild(span); queue.push(span);
        });
      };
      queue.length = 0;
      const t = $('ttl'); const tt = t.textContent; t.textContent = ''; addText(t, tt);
      for (const b of doc.blocks) {
        if (b.t !== 'li') ul = null;
        if (b.t === 'img') {
          const im = document.createElement('img'); im.src = b.src; im.alt = b.alt || ''; im.referrerPolicy = 'no-referrer'; im.loading = 'lazy'; body.appendChild(im); continue;
        }
        let el;
        if (b.t === 'li') { if (!ul) { ul = document.createElement('ul'); body.appendChild(ul); } el = document.createElement('li'); ul.appendChild(el); }
        else { el = document.createElement({ h2: 'h2', h3: 'h3', quote: 'blockquote', pre: 'pre' }[b.t] || 'p'); body.appendChild(el); }
        if (b.t === 'pre') el.textContent = b.text; else addText(el, b.text);
      }
    }

    // ---------- read aloud ----------
    const synth = window.speechSynthesis;
    let idx = -1; let playing = false; let paused = false; let current = null;
    function voices() { return synth ? synth.getVoices() : []; }
    function fillVoices() {
      const sel = $('voice'); const list = voices(); sel.textContent = '';
      if (!list.length) { const o = document.createElement('option'); o.textContent = 'No voices found'; sel.appendChild(o); sel.disabled = true; $('play').disabled = true; return; }
      const lang = (navigator.language || 'en').slice(0, 2);
      list.sort((a, b) => (b.lang.startsWith(lang) - a.lang.startsWith(lang)) || a.name.localeCompare(b.name));
      for (const v of list) { const o = document.createElement('option'); o.value = v.name; o.textContent = `${v.name.replace(/^Microsoft /, '')} (${v.lang})`; sel.appendChild(o); }
      sel.value = list.some((v) => v.name === prefs.voice) ? prefs.voice : list[0].name; sel.disabled = false; $('play').disabled = false;
    }
    function buttons() { $('play').innerHTML = playing && !paused ? '&#10074;&#10074; Pause' : paused ? '&#9654; Resume' : '&#9654; Read aloud'; $('stop').disabled = !playing; }
    function mark(i) {
      queue.forEach((s) => s.classList.remove('now'));
      const s = queue[i]; if (!s) return; s.classList.add('now');
      s.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    function next() {
      if (!playing) return;
      if (idx >= queue.length) { stop(); return; }
      mark(idx);
      const u = new SpeechSynthesisUtterance(queue[idx].textContent);
      u.rate = Number(prefs.rate) || 1;
      const v = voices().find((x) => x.name === $('voice').value); if (v) u.voice = v;
      u.onend = () => { if (playing && current === u) { idx++; next(); } };
      u.onerror = (e) => { if (e.error === 'interrupted' || e.error === 'canceled') return; if (playing && current === u) { idx++; next(); } };
      current = u; synth.speak(u);
    }
    function speakFrom(i) { if (!synth || i < 0) return; synth.cancel(); idx = i; playing = true; paused = false; next(); buttons(); }
    function stop() { playing = false; paused = false; current = null; if (synth) synth.cancel(); queue.forEach((s) => s.classList.remove('now')); buttons(); }

    $('play').onclick = () => {
      if (!playing) speakFrom(Math.max(0, queue.findIndex((s) => s.getBoundingClientRect().bottom > 90)));
      else if (paused) { synth.resume(); paused = false; buttons(); } else { synth.pause(); paused = true; buttons(); }
    };
    $('stop').onclick = stop;
    $('rate').onchange = (e) => { prefs.rate = e.target.value; savePrefs(); if (playing) speakFrom(idx); };
    $('voice').onchange = (e) => { prefs.voice = e.target.value; savePrefs(); if (playing) speakFrom(idx); };
    $('sm').onclick = () => { prefs.fs = Math.max(14, prefs.fs - 1); applyPrefs(); savePrefs(); };
    $('lg').onclick = () => { prefs.fs = Math.min(30, prefs.fs + 1); applyPrefs(); savePrefs(); };
    $('font').onchange = (e) => { prefs.font = e.target.value; applyPrefs(); savePrefs(); };
    $('width').onchange = (e) => { prefs.width = e.target.value; applyPrefs(); savePrefs(); };
    $('back').onclick = () => { stop(); if (doc) api.navigate(doc.sourceUrl); else history.back(); };
    addEventListener('pagehide', () => { if (synth) synth.cancel(); });
    addEventListener('keydown', (e) => { if (e.key === ' ' && e.target === document.body) { e.preventDefault(); $('play').click(); } });

    applyPrefs();
    if (synth) { fillVoices(); synth.onvoiceschanged = fillVoices; } else { $('play').disabled = true; }
    api.readerDoc().then((d) => {
      if (!d) { const m = $('msg'); m.style.display = 'block'; m.textContent = 'There is no article to show. Open a page and press F9 to use reader view.'; return; }
      doc = d; $('art').style.display = 'block'; build();
    });
  </script>
</body>
</html>
