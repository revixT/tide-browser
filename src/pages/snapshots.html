<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../theme.css">
<title>Snapshots</title>
<link rel="stylesheet" href="shared.css">
<script src="common.js"></script>
<style>
  main { max-width: 860px; }
  .lead { color: var(--muted); font-size: 13px; margin: 8px 0 8px; line-height: 1.5; }
  .snap { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); margin-top: 12px; overflow: hidden; animation: rowIn .5s var(--expo) backwards; animation-delay: calc(min(var(--i), 10) * 40ms); }
  .head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; cursor: pointer; }
  .head:hover { background: rgb(var(--ov) / .05); }
  .head .a { font-size: 15px; } .head .b { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .head .grow { flex: 1; }
  .tag { font-size: 11px; color: var(--accent); border: 1px solid rgb(var(--glow-rgb) / .35); border-radius: 9px; padding: 1px 8px; margin-left: 8px; }
  .tabs { display: none; padding: 4px 12px 12px; border-top: 1px solid var(--line); }
  .snap.open .tabs { display: block; }
  .tr { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 10px; cursor: pointer; font-size: 13px; }
  .tr:hover { background: rgb(var(--ov) / .06); }
  .tr .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr .hh { color: var(--muted); font-size: 12px; }
  .btn.pri { background: var(--accent-bg); border-color: var(--accent-line); color: var(--on-accent); }
  .btn.sm { height: 30px; padding: 0 14px; font-size: 12px; }
</style>
</head>
<body>
  <header class="bar"><h1>Snapshots</h1><span style="flex:1"></span><button class="btn pri" id="save">Save one now</button></header>
  <main>
    <p class="lead">Tide saves your open tabs every 30 minutes when something changed, and when you quit. Private tabs are never included. Pick one to bring those tabs back.</p>
    <div id="list"></div>
  </main>
  <script>
    const api = window.tidePage;
    const list = document.getElementById('list');
    let snaps = [];
    const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
    const when = (t) => new Date(t).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const REASON = { auto: 'Automatic', quit: 'When you quit', manual: 'Saved by you' };

    function draw(openId) {
      list.textContent = '';
      if (!snaps.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No snapshots yet. The first one is saved a couple of minutes after Tide starts.'; list.appendChild(e); return; }
      snaps.forEach((s, i) => {
        const d = document.createElement('div'); d.className = 'snap' + (s.id === openId ? ' open' : ''); d.style.setProperty('--i', i);
        const hd = document.createElement('div'); hd.className = 'head';
        const g = document.createElement('div'); g.className = 'grow';
        const a = document.createElement('div'); a.className = 'a'; a.textContent = when(s.time);
        const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = REASON[s.reason] || s.reason; a.appendChild(tg);
        const b = document.createElement('div'); b.className = 'b'; b.textContent = `${s.tabs.length} tab${s.tabs.length === 1 ? '' : 's'}`;
        g.append(a, b);
        const r = document.createElement('button'); r.className = 'btn sm'; r.textContent = 'Restore all';
        r.onclick = async (e) => { e.stopPropagation(); r.textContent = 'Restoring…'; await api.snapshotRestore(s.id); r.textContent = 'Restored'; };
        const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.title = 'Delete this snapshot';
        x.onclick = async (e) => { e.stopPropagation(); await api.snapshotDelete(s.id); snaps = snaps.filter((n) => n.id !== s.id); draw(); };
        hd.append(g, r, x);
        hd.onclick = () => d.classList.toggle('open');
        const ts = document.createElement('div'); ts.className = 'tabs';
        s.tabs.forEach((t, k) => {
          const row = document.createElement('div'); row.className = 'tr';
          const tt = document.createElement('div'); tt.className = 'tt'; tt.textContent = t.title || host(t.url);
          const hh = document.createElement('div'); hh.className = 'hh'; hh.textContent = host(t.url);
          row.append(tt, hh);
          row.onclick = () => api.snapshotRestore(s.id, k);
          ts.appendChild(row);
        });
        d.append(hd, ts); list.appendChild(d);
      });
    }
    document.getElementById('save').onclick = async () => { await api.snapshotSave(); snaps = await api.snapshotsList(); draw(snaps[0] && snaps[0].id); };
    api.snapshotsList().then((l) => { snaps = l; draw(); });
  </script>
</body>
</html>
