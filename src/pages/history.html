<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../theme.css">
<title>History</title>
<link rel="stylesheet" href="shared.css">
<script src="common.js"></script>
</head>
<body>
  <header class="bar">
    <h1>History</h1>
    <input type="text" class="search" id="search" placeholder="Search history" autofocus>
    <button class="btn" id="clear">Clear all</button>
    <button class="btn" id="more" title="Choose what to clear and for how long">Clear browsing data…</button>
  </header>
  <main id="list"></main>
  <script>
    let items = [];
    let firstPaint = true;
    const list = document.getElementById('list');
    function render() {
      list.classList.toggle('animate', firstPaint);
      firstPaint = false;
      let n = 0;
      const q = document.getElementById('search').value.toLowerCase();
      const shown = items.filter((i) => !q || i.title.toLowerCase().includes(q) || i.url.toLowerCase().includes(q));
      list.textContent = '';
      if (!shown.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'No history to show.'; list.appendChild(d); return; }
      let lastDay = '';
      for (const i of shown) {
        const d = new Date(i.time);
        const day = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
        if (day !== lastDay) { const h = document.createElement('h2'); h.textContent = day; list.appendChild(h); lastDay = day; }
        const row = document.createElement('div'); row.className = 'row'; row.style.setProperty('--i', n++);
        const t = document.createElement('span'); t.className = 't'; t.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const title = document.createElement('span'); title.className = 'title'; title.textContent = i.title;
        const url = document.createElement('span'); url.className = 'url'; url.textContent = i.url;
        const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.title = 'Remove from history';
        x.onclick = async (e) => {
          e.stopPropagation();
          await window.tidePage.removeHistory(i.url, i.time);
          row.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(40px)' }], { duration: 260, easing: 'ease-in', fill: 'forwards' })
            .onfinish = () => { items = items.filter((h) => h !== i); render(); };
        };
        row.append(t, title, url, x);
        row.onclick = () => window.tidePage.navigate(i.url);
        list.appendChild(row);
      }
    }
    document.getElementById('search').addEventListener('input', render);
    document.getElementById('more').onclick = () => window.tidePage.navigate('browser://settings#privacy');
    document.getElementById('clear').onclick = async () => { await window.tidePage.clearHistory(); items = []; render(); };
    window.tidePage.getHistory().then((h) => { items = h; render(); });
  </script>
</body>
</html>
