<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../theme.css">
<title>Recall</title>
<link rel="stylesheet" href="shared.css">
<script src="common.js"></script>
<style>
  .res { display: block; padding: 14px 16px; border-radius: 14px; cursor: pointer; animation: rowIn .5s var(--expo) backwards; animation-delay: calc(min(var(--i), 10) * 35ms); transition: background .25s, transform .35s var(--spring); position: relative; }
  .res:hover { background: rgb(var(--ov) / .06); transform: translateX(5px); }
  .res .t1 { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .t2 { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .res .sn { font-size: 13px; line-height: 1.5; color: var(--text); opacity: .85; }
  mark { background: rgb(var(--glow-rgb) / .25); color: var(--text-strong); border-radius: 3px; padding: 0 2px; }
  .res .x { position: absolute; right: 10px; top: 10px; }
  .panel { max-width: 560px; margin: 50px auto; padding: 30px; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); animation: rowIn .7s var(--expo); }
  .panel h2 { font-size: 22px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--text); margin: 0 0 10px; }
  .panel p, .panel li { color: var(--muted); font-size: 14px; line-height: 1.55; }
  .panel ul { padding-left: 20px; margin: 10px 0 20px; }
  .btn.pri { background: var(--accent-bg); border-color: var(--accent-line); color: var(--on-accent); height: 42px; padding: 0 26px; }
  .btn.danger { border-color: rgb(var(--bad-rgb) / .5); color: var(--bad); } .btn.danger.armed { background: rgb(var(--bad-rgb) / .15); }
  #count { color: var(--muted); font-size: 13px; }
  main { max-width: 900px; }
</style>
</head>
<body>
  <header class="bar">
    <h1>Recall</h1>
    <input type="text" class="search" id="q" placeholder="Search the text of pages you have read" autocomplete="off" style="display:none">
    <span id="count"></span>
    <span style="flex:1"></span>
    <button class="btn danger" id="clear" style="display:none">Clear Recall</button>
  </header>
  <main id="main"></main>
  <script>
    const api = window.tidePage;
    const main = document.getElementById('main');
    const q = document.getElementById('q');
    const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
    let timer = null;

    function marked(parent, snip) {
      // "[[word]]" marks a match. Build real nodes so page text can never become HTML.
      String(snip).split(/(\[\[.*?\]\])/).forEach((part) => {
        if (part.startsWith('[[') && part.endsWith(']]')) parent.appendChild(h('mark', '', part.slice(2, -2)));
        else parent.appendChild(document.createTextNode(part));
      });
    }

    async function search() {
      const rows = await api.recallSearch(q.value);
      main.textContent = '';
      if (!rows.length) { main.appendChild(h('div', 'empty', q.value ? 'Nothing matches that. Recall only knows pages you read after turning it on.' : 'Nothing saved yet. Pages you read from now on will show up here.')); return; }
      rows.forEach((r, i) => {
        const a = h('a', 'res'); a.style.setProperty('--i', i);
        a.append(h('div', 't1', r.title || r.url), h('div', 't2', `${r.host}  ·  ${ago(r.time)}`));
        const sn = h('div', 'sn'); marked(sn, r.snip); a.appendChild(sn);
        const x = h('button', 'x', '✕'); x.title = 'Forget this page';
        x.onclick = async (e) => { e.preventDefault(); e.stopPropagation(); await api.recallRemove(r.url); a.remove(); };
        a.appendChild(x);
        a.onclick = () => api.navigate(r.url);
        main.appendChild(a);
      });
    }

    function onboarding(st) {
      q.style.display = 'none';
      document.getElementById('clear').style.display = 'none';
      const p = h('div', 'panel');
      p.append(h('h2', '', 'Search everything you have read'));
      if (!st.available) { p.appendChild(h('p', '', 'Recall needs the system encryption store (Windows data protection or the macOS Keychain), which is not available here, so it stays off.')); main.textContent = ''; main.appendChild(p); return; }
      p.appendChild(h('p', '', 'Turn on Recall and Tide keeps a private copy of the text of pages you read, so you can find them later by what they said, not just their title.'));
      const ul = h('ul');
      for (const t of ['Everything stays on this PC and is encrypted. Nothing is uploaded.', 'Private tabs, login pages and banking, health and tax sites are never saved.', 'You can remove any page or a whole site, exclude sites in Settings, and clear everything at any time.']) ul.appendChild(h('li', '', t));
      p.appendChild(ul);
      const b = h('button', 'btn pri', 'Turn on Recall');
      b.onclick = async () => { await api.setSettings({ recallEnabled: true }); load(); };
      p.appendChild(b);
      main.textContent = ''; main.appendChild(p);
    }

    async function load() {
      const st = await api.recallStatus();
      if (!st.enabled) return onboarding(st);
      q.style.display = ''; document.getElementById('clear').style.display = '';
      document.getElementById('count').textContent = `${st.count.toLocaleString()} pages`;
      q.focus();
      search();
    }
    q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 160); });
    const clear = document.getElementById('clear');
    let armed = false, armT;
    clear.onclick = async () => {
      if (!armed) { armed = true; clear.textContent = 'Click again to delete everything'; clear.classList.add('armed'); armT = setTimeout(() => { armed = false; clear.textContent = 'Clear Recall'; clear.classList.remove('armed'); }, 4000); return; }
      clearTimeout(armT); armed = false; clear.textContent = 'Clear Recall'; clear.classList.remove('armed');
      await api.recallClear(); load();
    };
    load();
  </script>
</body>
</html>
