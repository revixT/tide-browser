<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../theme.css">
<title>Orbits</title>
<link rel="stylesheet" href="shared.css">
<script src="common.js"></script>
<style>
  .wrap { display: flex; gap: 24px; padding: 0 40px 30px; height: calc(100vh - 75px); }
  .left { width: 420px; flex: none; display: flex; flex-direction: column; min-height: 0; }
  #list { overflow: auto; flex: 1; padding: 6px 4px 20px 0; }
  .right { flex: 1; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  .it { display: flex; gap: 12px; padding: 12px 10px; border-radius: 14px; cursor: pointer; align-items: flex-start; animation: rowIn .5s var(--expo) backwards; animation-delay: calc(min(var(--i), 12) * 30ms); transition: background .25s, transform .35s var(--spring); }
  .it:hover, .it.hot { background: rgb(var(--ov) / .07); transform: translateX(4px); }
  .it .ava { width: 32px; height: 32px; border-radius: 50%; flex: none; background: rgb(var(--glow-rgb) / .15); color: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-weight: 600; text-transform: uppercase; }
  .it .tx { flex: 1; min-width: 0; }
  .it .a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .it .b { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .it .c { color: var(--muted); font-size: 12px; margin-top: 4px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  svg#sys { width: 100%; max-width: 640px; height: auto; max-height: calc(100vh - 120px); aspect-ratio: 1; overflow: visible; }
  .ring { fill: none; stroke: rgb(var(--glow-rgb) / .22); stroke-width: 1; stroke-dasharray: 3 7; }
  .rot { transform-origin: 300px 300px; animation: spin var(--d) linear infinite; }
  .rot:hover { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pl { cursor: pointer; }
  .pl circle { fill: var(--surface2); stroke: rgb(var(--glow-rgb) / .7); stroke-width: 1.4; transition: r .3s var(--spring), fill .3s; }
  .pl:hover circle, .pl.hot circle { r: 15; fill: rgb(var(--glow-rgb) / .35); }
  .pl text { font: 600 11px "Segoe UI", system-ui, sans-serif; fill: var(--text); text-anchor: middle; dominant-baseline: central; pointer-events: none; text-transform: uppercase; }
  .sun { filter: drop-shadow(0 0 14px rgb(var(--glow-rgb) / calc(.8 * var(--fx)))); animation: pulse 4s ease-in-out infinite; transform-origin: 300px 300px; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  .lbl { font: 11px "Segoe UI", system-ui, sans-serif; fill: var(--muted); text-anchor: middle; }
  #tip { position: fixed; z-index: 5; max-width: 280px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid rgb(var(--glow-rgb) / .4); box-shadow: 0 8px 24px rgb(var(--shadow-rgb) / calc(.5 * var(--shadow-k))); font-size: 12px; pointer-events: none; opacity: 0; transition: opacity .15s; }
  #tip b { display: block; font-weight: 500; font-size: 13px; margin-bottom: 3px; }
  #tip span { color: var(--muted); line-height: 1.4; display: block; }
  .empty { text-align: center; color: var(--muted); padding: 60px 20px; line-height: 1.6; }
  .btn.danger { border-color: rgb(var(--bad-rgb) / .5); color: var(--bad); }
  @media (max-width: 900px) { .wrap { flex-direction: column; height: auto; } .right { display: none; } .left { width: auto; } }
</style>
</head>
<body>
  <header class="bar">
    <h1>Orbits</h1>
    <input type="text" class="search" id="q" placeholder="Search archived tabs" autocomplete="off">
    <span style="flex:1"></span>
    <button class="btn" id="sweep" title="Move every tab you are not looking at into Orbits">Send other tabs</button>
    <button class="btn danger" id="clear">Clear</button>
  </header>
  <div class="wrap">
    <div class="left"><div id="list"></div></div>
    <div class="right">
      <svg id="sys" viewBox="0 0 600 600" aria-label="Orbit view"></svg>
    </div>
  </div>
  <div id="tip"><b></b><span></span></div>
  <script>
    const api = window.tidePage;
    const NS = 'http://www.w3.org/2000/svg';
    const list = document.getElementById('list');
    const sys = document.getElementById('sys');
    const tip = document.getElementById('tip');
    let items = [];
    const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
    const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 60 ? `${Math.max(1, m)} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
    const hash = (s) => { let x = 0; for (let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) >>> 0; return x; };
    const el = (tag, attrs = {}, text) => { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; };
    const hot = (id, on) => document.querySelectorAll(`[data-id="${id}"]`).forEach((n) => n.classList.toggle('hot', on));

    function restore(o) { api.orbitRestore(o.id).then(() => { items = items.filter((x) => x.id !== o.id); draw(); }); }

    function showTip(e, o) {
      tip.querySelector('b').textContent = o.title;
      tip.querySelector('span').textContent = `${host(o.url)}  ·  ${ago(o.archivedAt)}${o.summary ? `\n${o.summary}` : ''}`;
      tip.querySelector('span').style.whiteSpace = 'pre-line';
      tip.style.left = Math.min(innerWidth - 300, e.clientX + 14) + 'px';
      tip.style.top = Math.min(innerHeight - 120, e.clientY + 14) + 'px';
      tip.style.opacity = 1;
    }

    function drawSystem(filtered) {
      sys.textContent = '';
      const rings = [
        { r: 118, label: 'Today', test: (o) => Date.now() - o.archivedAt < 864e5, dur: 70 },
        { r: 190, label: 'This week', test: (o) => Date.now() - o.archivedAt < 7 * 864e5, dur: 110 },
        { r: 262, label: 'Older', test: () => true, dur: 160 },
      ];
      const placed = new Set();
      rings.forEach((rg) => {
        sys.appendChild(el('circle', { cx: 300, cy: 300, r: rg.r, class: 'ring' }));
        const mine = filtered.filter((o) => !placed.has(o.id) && rg.test(o)).slice(0, 36);
        mine.forEach((o) => placed.add(o.id));
        const g = el('g', { class: 'rot', style: `--d:${rg.dur}s` });
        mine.forEach((o, i) => {
          const ang = ((i / Math.max(mine.length, 1)) * 360 + (hash(o.id) % 20)) * Math.PI / 180;
          const p = el('g', { class: 'pl', 'data-id': o.id, transform: `translate(${300 + Math.cos(ang) * rg.r} ${300 + Math.sin(ang) * rg.r})` });
          p.append(el('circle', { r: 11 }), el('text', {}, (host(o.url)[0] || '?')));
          p.addEventListener('mousemove', (e) => { showTip(e, o); hot(o.id, true); });
          p.addEventListener('mouseleave', () => { tip.style.opacity = 0; hot(o.id, false); });
          p.addEventListener('click', () => restore(o));
          g.appendChild(p);
        });
        sys.appendChild(g);
        const t = el('text', { x: 300, y: 300 - rg.r - 8, class: 'lbl' }, rg.label);
        sys.appendChild(t);
      });
      const sun = el('g', { class: 'sun' });
      sun.append(el('circle', { cx: 300, cy: 300, r: 30, fill: 'var(--accent)', opacity: '.25' }), el('path', { d: 'M300 276c2 14 7 21 24 24-17 3-22 10-24 24-2-14-7-21-24-24 17-3 22-10 24-24z', fill: 'var(--accent)' }));
      sys.appendChild(sun);
    }

    function draw() {
      const q = document.getElementById('q').value.trim().toLowerCase();
      const filtered = items.filter((o) => !q || `${o.title} ${o.url} ${o.summary}`.toLowerCase().includes(q));
      list.textContent = '';
      if (!filtered.length) {
        const e = document.createElement('div'); e.className = 'empty';
        e.textContent = items.length ? 'Nothing matches that.' : 'No tabs in orbit yet. Tabs you have not used for a while drift here, and you can send some now with the button above.';
        list.appendChild(e);
      }
      filtered.forEach((o, i) => {
        const d = document.createElement('div'); d.className = 'it'; d.style.setProperty('--i', i); d.dataset.id = o.id;
        const ava = document.createElement('div'); ava.className = 'ava'; ava.textContent = host(o.url)[0] || '?';
        const tx = document.createElement('div'); tx.className = 'tx';
        const a = document.createElement('div'); a.className = 'a'; a.textContent = o.title;
        const b = document.createElement('div'); b.className = 'b'; b.textContent = `${host(o.url)}  ·  ${ago(o.archivedAt)}`;
        tx.append(a, b);
        if (o.summary) { const c = document.createElement('div'); c.className = 'c'; c.textContent = o.summary; tx.appendChild(c); }
        const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.title = 'Remove from Orbits';
        x.onclick = async (e) => { e.stopPropagation(); await api.orbitRemove(o.id); items = items.filter((n) => n.id !== o.id); draw(); };
        d.append(ava, tx, x);
        d.onclick = () => restore(o);
        d.addEventListener('mouseenter', () => hot(o.id, true));
        d.addEventListener('mouseleave', () => hot(o.id, false));
        list.appendChild(d);
      });
      drawSystem(filtered);
    }

    document.getElementById('q').addEventListener('input', draw);
    document.getElementById('clear').onclick = async function () {
      if (this.dataset.armed !== '1') { this.dataset.armed = '1'; this.textContent = 'Click again'; setTimeout(() => { this.dataset.armed = ''; this.textContent = 'Clear'; }, 3500); return; }
      await api.orbitClear(); items = []; this.textContent = 'Clear'; this.dataset.armed = ''; draw();
    };
    document.getElementById('sweep').onclick = async function () {
      this.disabled = true;
      const n = await api.orbitSweep();
      this.textContent = n ? `Moved ${n}` : 'Nothing to move';
      items = await api.orbitsList(); draw();
      setTimeout(() => { this.textContent = 'Send other tabs'; this.disabled = false; }, 1800);
    };
    api.orbitsList().then((l) => { items = l; draw(); });
  </script>
</body>
</html>
