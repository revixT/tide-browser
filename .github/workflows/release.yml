# Builds the Windows installer and publishes a GitHub release when you push a version tag such as v1.0.3.
# Installed copies of Tide find that release and update themselves.
# No secrets are needed: GitHub gives every run a temporary token (GITHUB_TOKEN).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # lets this run create the release and upload the installer

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check the tag matches the version in package.json
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says version $VERSION."
            echo "Change the version in package.json, commit it, then tag that commit."
            exit 1
          fi

      - name: Point update checks at this repository
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.build.publish = [{
              provider: 'github',
              owner: process.env.GITHUB_REPOSITORY_OWNER,
              repo: process.env.GITHUB_REPOSITORY.split('/')[1],
              releaseType: 'release'
            }];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - run: npm ci

      - name: Build the installer and publish the release
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # the installer is not code-signed yet
