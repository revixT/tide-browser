<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="shared.css">
<title>Bookmarks</title>
<script src="bridge.js"></script>
<style>
  .edit { background: none; border: 0; color: var(--muted); width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; }
  .edit svg { width: 18px; height: 18px; }
  .edit:active { background: rgb(var(--ov) / .1); }
</style>
</head>
<body>
  <header class="bar">
    <div class="top"><h1>Bookmarks</h1></div>
    <input type="search" class="search" id="search" placeholder="Search bookmarks">
  </header>
  <main id="list"></main>
  <script>
    let items = [];
    let firstPaint = true;
    const list = document.getElementById('list');
    const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
    function render() {
      list.classList.toggle('animate', firstPaint);
      firstPaint = false;
      const q = document.getElementById('search').value.toLowerCase();
      const shown = items.filter((b) => !q || b.title.toLowerCase().includes(q) || b.url.toLowerCase().includes(q));
      list.textContent = '';
      if (!shown.length) {
        const d = document.createElement('div'); d.className = 'empty';
        d.textContent = q ? 'Nothing matches that.' : 'No bookmarks yet. Open the menu on any page and tap Bookmark.';
        list.appendChild(d); return;
      }
      shown.forEach((b, n) => {
        const row = document.createElement('div'); row.className = 'row'; row.style.setProperty('--i', n);
        const fav = document.createElement('div'); fav.className = 'fav';
        const img = document.createElement('img'); img.alt = '';
        img.src = `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(host(b.url))}`;
        img.onerror = () => { fav.textContent = (host(b.url)[0] || '?').toUpperCase(); };
        fav.appendChild(img);
        const col = document.createElement('div'); col.className = 'col';
        const title = document.createElement('div'); title.className = 'title'; title.textContent = b.title || host(b.url);
        const url = document.createElement('div'); url.className = 'url'; url.textContent = host(b.url);
        col.append(title, url);
        const ed = document.createElement('button'); ed.className = 'edit'; ed.setAttribute('aria-label', 'Rename');
        ed.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
        ed.onclick = async (e) => {
          e.stopPropagation();
          const t = prompt('Bookmark name', b.title);
          if (t == null || !t.trim()) return;
          await window.tidePage.renameBookmark(b.url, t.trim()); b.title = t.trim(); render();
        };
        const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Remove bookmark');
        x.onclick = async (e) => {
          e.stopPropagation();
          await window.tidePage.removeBookmark(b.url);
          row.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(60px)' }], { duration: 240, easing: 'ease-in', fill: 'forwards' })
            .onfinish = () => { items = items.filter((i) => i !== b); render(); };
        };
        row.append(fav, col, ed, x);
        row.onclick = () => window.tidePage.navigate(b.url);
        list.appendChild(row);
      });
    }
    document.getElementById('search').addEventListener('input', render);
    window.tidePage.getBookmarks().then((b) => { items = b; render(); });
  </script>
</body>
</html>
