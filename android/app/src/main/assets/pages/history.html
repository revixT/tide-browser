<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="shared.css">
<title>History</title>
<script src="bridge.js"></script>
</head>
<body>
  <header class="bar">
    <div class="top"><h1>History</h1><button class="btn danger" id="clear">Clear all</button></div>
    <input type="search" class="search" id="search" placeholder="Search history">
  </header>
  <main id="list"></main>
  <script>
    let items = [];
    let firstPaint = true;
    const list = document.getElementById('list');
    const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
    function render() {
      list.classList.toggle('animate', firstPaint);
      firstPaint = false;
      let n = 0;
      const q = document.getElementById('search').value.toLowerCase();
      const shown = items.filter((i) => !q || i.title.toLowerCase().includes(q) || i.url.toLowerCase().includes(q));
      list.textContent = '';
      if (!shown.length) {
        const d = document.createElement('div'); d.className = 'empty';
        d.textContent = q ? 'Nothing matches that.' : 'No history yet. Pages you visit show up here. Private tabs are never saved.';
        list.appendChild(d); return;
      }
      let lastDay = '';
      for (const i of shown.slice(0, 600)) {
        const d = new Date(i.time);
        const day = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
        if (day !== lastDay) { const h = document.createElement('h2'); h.textContent = day; list.appendChild(h); lastDay = day; }
        const row = document.createElement('div'); row.className = 'row'; row.style.setProperty('--i', n++);
        const fav = document.createElement('div'); fav.className = 'fav'; fav.textContent = (host(i.url)[0] || '?').toUpperCase();
        const col = document.createElement('div'); col.className = 'col';
        const title = document.createElement('div'); title.className = 'title'; title.textContent = i.title || host(i.url);
        const url = document.createElement('div'); url.className = 'url';
        url.textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + '  ·  ' + host(i.url);
        col.append(title, url);
        const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Remove from history');
        x.onclick = async (e) => {
          e.stopPropagation();
          await window.tidePage.removeHistory(i.url, i.time);
          row.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateX(60px)' }], { duration: 240, easing: 'ease-in', fill: 'forwards' })
            .onfinish = () => { items = items.filter((h) => h !== i); render(); };
        };
        row.append(fav, col, x);
        row.onclick = () => window.tidePage.navigate(i.url);
        list.appendChild(row);
      }
    }
    document.getElementById('search').addEventListener('input', render);
    document.getElementById('clear').onclick = async () => {
      if (!items.length || !confirm('Delete all history? This cannot be undone.')) return;
      await window.tidePage.clearHistory(); items = []; render();
    };
    window.tidePage.getHistory().then((h) => { items = h; render(); });
  </script>
</body>
</html>
