<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="shared.css">
<title>Snapshots</title>
<script src="bridge.js"></script>
<style>
  /* Tide for Android: same as desktop src/pages/snapshots.html, sized for touch. */
  .lead { color: var(--muted); font-size: 13.5px; margin: 10px 10px 4px; line-height: 1.5; }
  .snap { border: 1px solid var(--line); border-radius: 20px; background: var(--surface); margin: 12px 4px 0; overflow: hidden; }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 10px 14px 16px; }
  .head:active { background: rgb(var(--ov) / .05); }
  .head .a { font-size: 15px; } .head .b { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .head .grow { flex: 1; min-width: 0; }
  .tag { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid rgb(var(--glow-rgb) / .35); border-radius: 9px; padding: 1px 8px; margin-top: 6px; }
  .tabs { display: none; padding: 4px 8px 10px; border-top: 1px solid var(--line); }
  .snap.open .tabs { display: block; animation: rowIn .4s var(--expo); }
  .tr { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 12px; font-size: 14px; }
  .tr:active { background: rgb(var(--ov) / .06); }
  .tr .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tr .hh { color: var(--muted); font-size: 12px; flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn.sm { height: 34px; padding: 0 14px; font-size: 13px; }
</style>
</head>
<body>
  <header class="bar"><div class="top"><h1>Snapshots</h1><button class="btn p" id="save">Save now</button></div></header>
  <main id="main">
    <p class="lead">Tide saves your open tabs every 30 minutes when something changed, and when you leave the app. Private tabs are never included. Pick one to bring those tabs back.</p>
    <div id="list"></div>
  </main>
  <script>
    const api = window.tidePage;
    const list = document.getElementById('list');
    let snaps = [];
    let first = true;
    const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
    const when = (t) => new Date(t).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const REASON = { auto: 'Automatic', quit: 'When you left Tide', manual: 'Saved by you' };

    function draw(openId) {
      document.getElementById('main').classList.toggle('animate', first); first = false;
      list.textContent = '';
      if (!snaps.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No snapshots yet. The first one is saved a couple of minutes after Tide starts, or when you leave the app.'; list.appendChild(e); return; }
      snaps.forEach((s, i) => {
        const d = document.createElement('div'); d.className = 'snap card' + (s.id === openId ? ' open' : ''); d.style.setProperty('--i', i);
        const hd = document.createElement('div'); hd.className = 'head';
        const g = document.createElement('div'); g.className = 'grow';
        const a = document.createElement('div'); a.className = 'a'; a.textContent = when(s.time);
        const b = document.createElement('div'); b.className = 'b'; b.textContent = `${s.tabs.length} tab${s.tabs.length === 1 ? '' : 's'}`;
        const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = REASON[s.reason] || s.reason;
        g.append(a, b, tg);
        const r = document.createElement('button'); r.className = 'btn sm'; r.textContent = 'Restore';
        r.onclick = async (e) => { e.stopPropagation(); r.textContent = 'Opening…'; await api.snapshotRestore(s.id); r.textContent = 'Restored'; };
        const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Delete this snapshot');
        x.onclick = async (e) => { e.stopPropagation(); await api.snapshotDelete(s.id); snaps = snaps.filter((n) => n.id !== s.id); draw(); };
        hd.append(g, r, x);
        hd.onclick = () => d.classList.toggle('open');
        const ts = document.createElement('div'); ts.className = 'tabs';
        s.tabs.forEach((t, k) => {
          const row = document.createElement('div'); row.className = 'tr';
          const tt = document.createElement('div'); tt.className = 'tt'; tt.textContent = t.title || host(t.url);
          const hh = document.createElement('div'); hh.className = 'hh'; hh.textContent = host(t.url);
          row.append(tt, hh);
          row.onclick = () => api.snapshotRestore(s.id, k);
          ts.appendChild(row);
        });
        d.append(hd, ts); list.appendChild(d);
      });
    }
    document.getElementById('save').onclick = async () => { const ok = await api.snapshotSave(); snaps = await api.snapshotsList(); draw(ok && snaps[0] && snaps[0].id); };
    api.snapshotsList().then((l) => { snaps = l; draw(); });
  </script>
</body>
</html>
