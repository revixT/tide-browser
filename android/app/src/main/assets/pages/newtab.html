<!doctype html>
<html class="wait" data-no-reduce>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="../theme.css">
<title>New Tab</title>
<script src="bridge.js"></script>
<style>
  /* Tide for Android: the same scene as the desktop new tab page (src/pages/newtab.html), sized for phones and touch. */
  :root {
    --nt-sky: #07080b;
    --neb1: rgba(90,60,200,.4); --neb2: rgba(40,110,230,.32);
    --planet-fill: radial-gradient(circle at 50% 0%, #0a0e1b 0%, #050609 60%);
    --planet-glow: 0 -1px 2px #aebfff, 0 -6px 16px rgba(150,180,255,.5), 0 -26px 64px rgba(80,120,255,.3), 0 -84px 170px rgba(50,80,200,.2);
    --haze: rgba(60,90,200,.18);
    --rise-from: brightness(.15) blur(10px); --rise-mid: brightness(1.4) blur(0); --rise-op: 1;
    --logo-1: #ffffff; --logo-2: #8fa8ff; --flare: #ffffff;
    --sb-a: rgb(255 255 255 / .07); --sb-b: rgb(255 255 255 / .045); --sb-b-focus: rgb(255 255 255 / .08);
    --tile-a: #15161c; --tile-b: #111217;
    --private: #d9c7ff;
    --star-1: 255,255,255; --star-2: 170,195,255; --shoot: 255,255,255; --star-alpha: 1;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --nt-sky: linear-gradient(180deg, #e3eaff 0%, #f2f5ff 52%, #fbfcff 100%);
      --neb1: rgba(120,100,255,.5); --neb2: rgba(70,150,255,.42);
      --planet-fill: radial-gradient(circle at 50% 0%, #ffffff 0%, #e8edff 40%, #d2dcff 100%);
      --planet-glow: 0 -1px 2px rgba(70,100,230,.5), 0 -8px 22px rgba(150,175,255,.55), 0 -34px 80px rgba(120,150,255,.28), 0 -100px 190px rgba(120,150,255,.18);
      --haze: rgba(120,150,255,.22);
      --rise-from: brightness(1.05) blur(12px); --rise-mid: brightness(1.02) blur(0); --rise-op: 0;
      --logo-1: #3556d8; --logo-2: #8ea4ff; --flare: #6f8cff;
      --sb-a: rgb(255 255 255 / .9); --sb-b: rgb(238 242 255 / .92); --sb-b-focus: rgb(255 255 255 / .98);
      --tile-a: #ffffff; --tile-b: #f0f3fc;
      --private: #6d3fc4;
      --star-1: 60,90,200; --star-2: 110,130,230; --shoot: 60,90,210; --star-alpha: .6;
    }
  }
  @property --a { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  html { --k: 1; --spring: cubic-bezier(.34,1.56,.64,1); --expo: cubic-bezier(.16,1,.3,1); }
  html.fast { --k: .42; }
  html.wait *, html.wait *::before, html.wait *::after { animation-play-state: paused !important; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--nt-sky); color: var(--text); font-family: system-ui, "Roboto", sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: max(9vh, 40px); }

  /* ---------- space backdrop ---------- */
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .nebula { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(50px); opacity: 0;
    animation: nebIn calc(3s * var(--k)) ease-out calc(.4s * var(--k)) forwards, drift 38s ease-in-out infinite alternate; }
  .nebula.n1 { width: 90vw; height: 40vh; left: -25vw; top: 4vh; background: radial-gradient(closest-side, var(--neb1), transparent); }
  .nebula.n2 { width: 80vw; height: 36vh; right: -22vw; top: 24vh; background: radial-gradient(closest-side, var(--neb2), transparent); animation-delay: calc(.6s * var(--k)), -12s; animation-duration: calc(3s * var(--k)), 46s; }
  @keyframes nebIn { to { opacity: .3; } }
  @keyframes drift { from { transform: translate(0,0) scale(1) rotate(0); } to { transform: translate(6vw,-3vh) scale(1.2) rotate(14deg); } }

  .layer-planet { position: fixed; inset: 0; pointer-events: none; }
  .planet-wrap { position: absolute; inset: 0; animation: rise calc(2.8s * var(--k)) var(--expo) backwards; }
  @keyframes rise { from { transform: translateY(46vh) scale(1.08); filter: var(--rise-from); opacity: var(--rise-op); } 60% { filter: var(--rise-mid); opacity: 1; } to { transform: none; filter: none; opacity: 1; } }
  .planet { position: absolute; left: 50%; bottom: calc(9vh - 420vw); width: 420vw; height: 420vw; transform: translateX(-50%); border-radius: 50%;
    background: var(--planet-fill); box-shadow: var(--planet-glow); }
  .haze { position: fixed; left: 0; right: 0; bottom: 0; height: 34vh; pointer-events: none;
    background: radial-gradient(ellipse 80% 100% at 50% 100%, var(--haze), transparent 70%);
    animation: hazeIn calc(2.6s * var(--k)) ease-out backwards, breathe 7s ease-in-out infinite; }
  @keyframes hazeIn { from { opacity: 0; } }
  @keyframes breathe { 50% { opacity: .55; } }

  /* ---------- logo ---------- */
  .logo-wrap { position: relative; z-index: 1; width: 80px; height: 80px; flex: none;
    animation: logoIn calc(1.4s * var(--k)) cubic-bezier(.34,1.45,.5,1) calc(.55s * var(--k)) backwards; }
  @keyframes logoIn { from { transform: scale(0) rotate(-220deg); opacity: 0; filter: blur(20px) brightness(4); } 55% { opacity: 1; } to { transform: none; filter: none; } }
  .logo { position: relative; width: 100%; height: 100%; filter: drop-shadow(0 0 18px rgb(var(--glow-rgb) / calc(.65 * var(--fx))));
    animation: float 6s ease-in-out infinite, glowPulse 4.5s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px) rotate(2deg); } }
  @keyframes glowPulse { 50% { filter: drop-shadow(0 0 28px rgb(var(--glow-rgb) / calc(.95 * var(--fx)))); } }
  .ring { position: absolute; inset: -30px; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from var(--a), transparent 0%, rgb(var(--glow-rgb) / .7) 12%, transparent 40%, rgb(var(--glow-rgb) / .35) 66%, transparent 90%);
    -webkit-mask: radial-gradient(circle, transparent 54%, #000 57%, #000 59%, transparent 62%);
    mask: radial-gradient(circle, transparent 54%, #000 57%, #000 59%, transparent 62%);
    animation: ringIn calc(1.8s * var(--k)) var(--expo) calc(.9s * var(--k)) backwards, orbit 12s linear infinite; }
  @keyframes ringIn { from { transform: scale(.2); opacity: 0; } }
  @keyframes orbit { to { --a: 360deg; } }
  .flare { position: absolute; left: 50%; top: 50%; width: 96vw; height: 2px; margin: -1px 0 0 -48vw;
    background: linear-gradient(90deg, transparent, var(--flare) 50%, transparent); filter: drop-shadow(0 0 12px var(--accent)); opacity: 0; pointer-events: none;
    animation: flare calc(1.6s * var(--k)) ease-out calc(.8s * var(--k)); }
  @keyframes flare { 0% { transform: scaleX(0); opacity: 0; } 22% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1.5); opacity: 0; } }

  /* ---------- wordmark: four hairline letters drawn as strokes ---------- */
  .name { position: relative; z-index: 1; margin: 48px 0 0; line-height: 0; }
  .name svg { height: 38px; width: auto; overflow: visible; filter: drop-shadow(0 0 12px rgb(var(--glow-rgb) / calc(.5 * var(--fx)))); }
  .name path { fill: none; stroke: var(--text); stroke-width: 1.4px; stroke-linecap: square; stroke-linejoin: miter; vector-effect: non-scaling-stroke;
    stroke-dasharray: 1; stroke-dashoffset: 0;
    animation: letterDraw calc(1.6s * var(--k)) var(--expo) calc((1.1s + var(--i) * .22s) * var(--k)) backwards; }
  @keyframes letterDraw { from { stroke-dashoffset: 1; opacity: 0; } 12% { opacity: 1; } }
  .tag { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin-top: 16px; font-size: 10.5px; font-weight: 400; text-transform: uppercase; --tg: color-mix(in srgb, var(--muted) 70%, var(--text)); color: var(--tg); }
  .tag span { letter-spacing: .62em; margin-right: -.62em; padding-left: .1em;
    background: linear-gradient(100deg, var(--tg) 0%, var(--tg) 38%, var(--text) 50%, var(--tg) 62%, var(--tg) 100%) 0 0 / 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: tagIn calc(1.3s * var(--k)) var(--expo) calc(1.6s * var(--k)) backwards, tagShine 7s ease-in-out calc(3.2s * var(--k)) infinite; }
  @keyframes tagIn { from { opacity: 0; letter-spacing: 1.4em; filter: blur(8px); } }
  @keyframes tagShine { 0%, 55% { background-position: 100% 0; } 100% { background-position: -50% 0; } }
  .tag i { position: relative; width: 36px; height: 1px; animation: lineIn calc(1.2s * var(--k)) var(--expo) calc(1.6s * var(--k)) backwards; }
  .tag i::after { content: ''; position: absolute; top: -1.5px; width: 4px; height: 4px; border-radius: 50%; background: var(--muted); }
  .tag i:first-child { background: linear-gradient(90deg, transparent, var(--muted)); transform-origin: 100% 50%; }
  .tag i:first-child::after { right: -2px; }
  .tag i:last-child { background: linear-gradient(270deg, transparent, var(--muted)); transform-origin: 0 50%; }
  .tag i:last-child::after { left: -2px; }
  @keyframes lineIn { from { transform: scaleX(0); opacity: 0; } }

  /* ---------- search ---------- */
  form { position: relative; z-index: 1; width: min(560px, 88vw); margin-top: 5.5vh; }
  .sb { position: relative; display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 8px 0 20px; border-radius: 28px;
    border: 1px solid rgb(var(--ov) / .16);
    background: linear-gradient(180deg, var(--sb-a), var(--sb-b));
    box-shadow: 0 0 20px rgb(var(--glow-rgb) / calc(.35 * var(--fx))), inset 0 0 20px rgb(var(--glow-rgb) / calc(.12 * var(--fx)));
    transition: transform .6s var(--spring), box-shadow .5s, background .5s;
    animation: sbIn calc(1.5s * var(--k)) var(--expo) calc(1.85s * var(--k)) backwards; }
  @keyframes sbIn { from { transform: scale(.03, .45); opacity: 0; filter: blur(10px); } 40% { opacity: 1; } 70% { filter: blur(0); } }
  .sb::before { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; padding: 1.5px; pointer-events: none;
    background: conic-gradient(from var(--a), rgb(var(--glow-rgb) / .95), rgb(var(--glow-rgb) / .08) 28%, rgb(var(--glow-rgb) / .9) 52%, rgb(var(--glow-rgb) / .08) 78%, rgb(var(--glow-rgb) / .95));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    opacity: .5; animation: orbit 7s linear infinite; }
  .sb:focus-within { transform: translateY(-2px) scale(1.012); box-shadow: 0 0 40px rgb(var(--glow-rgb) / calc(.6 * var(--fx))), inset 0 0 28px rgb(var(--glow-rgb) / calc(.2 * var(--fx))); background: linear-gradient(180deg, var(--sb-a), var(--sb-b-focus)); }
  .sb svg { color: var(--text-strong); width: 22px; height: 22px; flex: none; transition: transform .6s var(--spring); }
  .sb svg.s { animation: sbContent calc(.9s * var(--k)) var(--expo) calc(2.7s * var(--k)) backwards; }
  .sb:focus-within svg.s { transform: scale(1.15) rotate(-12deg); }
  .sb input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text-strong); font-size: 16px; font-family: inherit; user-select: text; -webkit-user-select: text;
    animation: sbContent calc(.9s * var(--k)) var(--expo) calc(2.75s * var(--k)) backwards; }
  .sb input::placeholder { color: var(--muted); transition: opacity .3s, transform .3s; }
  .sb input:focus::placeholder { opacity: .35; transform: translateX(6px); }
  @keyframes sbContent { from { opacity: 0; transform: translateX(-14px); filter: blur(5px); } }
  .go { width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%; background: var(--accent-bg); color: var(--on-accent); display: grid; place-items: center;
    opacity: 0; transform: scale(.4) rotate(-90deg); transition: opacity .25s, transform .45s var(--spring); pointer-events: none; }
  .go svg { color: inherit; width: 20px; height: 20px; }
  .sb.has .go { opacity: 1; transform: none; pointer-events: auto; }
  .go:active { transform: scale(.88) !important; }

  /* ---------- tiles ---------- */
  .tiles { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(4, 64px); gap: 18px 18px; margin-top: 30px; justify-content: center; }
  .tile { --s: 1; position: relative; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .tile .face { position: relative; width: 58px; height: 54px; border-radius: 16px; border: 1px solid var(--border);
    background: linear-gradient(180deg, var(--tile-a), var(--tile-b)); display: flex; align-items: center; justify-content: center;
    transform: scale(var(--s)); transition: transform .35s var(--spring), border-color .3s, box-shadow .35s;
    animation: bob 5.5s ease-in-out calc(var(--i) * -.8s) infinite; }
  .tile.intro { animation: tileIn calc(1.1s * var(--k)) var(--spring) calc((2.45s + var(--i) * .07s) * var(--k)) backwards; }
  .tile.pop { animation: tileIn .7s var(--spring) backwards; }
  @keyframes tileIn { from { opacity: 0; transform: translateY(80px) scale(.15) rotate(-24deg); filter: blur(12px); } 50% { filter: blur(0); } }
  @keyframes bob { 50% { translate: 0 -5px; } }
  .tile:active .face { --s: .9; border-color: rgb(var(--glow-rgb) / .75); box-shadow: 0 0 22px rgb(var(--glow-rgb) / calc(.5 * var(--fx))); }
  .tile img { width: 28px; height: 28px; border-radius: 7px; }
  .tile .ltr { font-size: 20px; font-weight: 600; }
  .tile .lbl { max-width: 66px; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .rm { position: absolute; top: -8px; right: -2px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 11px; line-height: 1; padding: 0; display: none; z-index: 2; }
  .editing .tile .rm { display: block; animation: rmIn .35s var(--spring); }
  @keyframes rmIn { from { transform: scale(0); } }
  .editing .tile:not(.add) .face { animation: wiggle .32s ease-in-out infinite alternate; animation-delay: calc(var(--i) * -.07s); }
  @keyframes wiggle { from { transform: rotate(-2.2deg); } to { transform: rotate(2.2deg); } }
  .tile.add .face { color: var(--muted); border-style: dashed; }
  .tile.add svg { width: 24px; height: 24px; }
  .hint { position: relative; z-index: 1; margin-top: 18px; font-size: 12px; color: var(--muted); opacity: 0; transition: opacity .3s; }
  .editing ~ .hint { opacity: 1; }

  dialog { border: 1px solid rgb(var(--glow-rgb) / .5); border-radius: 22px; background: var(--surface); color: var(--text); padding: 22px; width: min(380px, 88vw); box-shadow: 0 0 30px rgb(var(--glow-rgb) / calc(.3 * var(--fx))); }
  dialog[open] { animation: dlgIn .5s var(--spring); }
  dialog::backdrop { background: rgb(var(--shadow-rgb) / calc(.65 * var(--shadow-k))); backdrop-filter: blur(4px); }
  @keyframes dlgIn { from { opacity: 0; transform: translateY(24px) scale(.88); filter: blur(6px); } }
  dialog h3 { margin: 0 0 14px; font-weight: 500; }
  dialog input { width: 100%; height: 46px; border-radius: 14px; border: 1px solid var(--border); background: var(--bg); color: var(--text-strong); padding: 0 14px; margin-bottom: 10px; outline: 0; font-size: 16px; user-select: text; -webkit-user-select: text; }
  dialog input:focus { border-color: rgb(var(--glow-rgb) / .8); }
  dialog .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  dialog button { height: 42px; padding: 0 20px; border-radius: 21px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-strong); font-size: 15px; transition: transform .3s var(--spring); }
  dialog button:active { transform: scale(.94); }
  dialog button.p { background: var(--accent-bg); border-color: var(--accent-line); color: var(--on-accent); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
  html.reduce *, html.reduce *::before, html.reduce *::after { animation-duration: .001ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }

  .priv-note { display: none; position: relative; z-index: 1; margin-top: 16px; max-width: 86vw; padding: 9px 16px; border-radius: 18px; font-size: 12px; line-height: 1.45; text-align: center;
    color: var(--private); border: 1px solid rgb(var(--glow-rgb) / .55); background: rgba(120,70,220,.14); box-shadow: 0 0 18px rgba(150,100,255,.25); }
  html.private .priv-note { display: block; animation: sbContent calc(1s * var(--k)) var(--expo) calc(1.9s * var(--k)) backwards; }
  html.private .nebula.n1 { background: radial-gradient(closest-side, rgba(150,70,230,.6), transparent); }

  /* short screens and landscape */
  @media (max-height: 560px) {
    body { padding-top: 18px; }
    .logo-wrap { width: 56px; height: 56px; } .ring { inset: -20px; }
    .name { margin-top: 26px; } .name svg { height: 28px; }
    form { margin-top: 16px; } .tiles { margin-top: 16px; grid-template-columns: repeat(6, 64px); }
  }
</style>
</head>
<body>
  <canvas id="sky"></canvas>
  <div class="nebula n1"></div><div class="nebula n2"></div>
  <div class="layer-planet"><div class="planet-wrap"><div class="planet"></div></div></div>
  <div class="haze"></div>

  <div class="logo-wrap">
    <div class="ring"></div>
    <div class="flare"></div>
    <svg class="logo" viewBox="0 0 100 100">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--logo-1)"/><stop offset="1" style="stop-color:var(--logo-2)"/></linearGradient></defs>
      <mask id="tm"><rect width="100" height="100" fill="#fff"/><path d="M0 57q12.5-12 25 0t25 0t25 0t25 0" fill="none" stroke="#000" stroke-width="6.5"/><path d="M0 75q12.5 12 25 0t25 0t25 0t25 0" fill="none" stroke="#000" stroke-width="6.5"/></mask>
      <circle cx="50" cy="50" r="46" fill="url(#g)" mask="url(#tm)"/>
    </svg>
  </div>
  <h1 class="name" aria-label="TIDE"><svg viewBox="0 0 190 40" aria-hidden="true">
    <path pathLength="1" style="--i:0" d="M0 0H30M15 0V40"/>
    <path pathLength="1" style="--i:1" d="M66 0V40"/>
    <path pathLength="1" style="--i:2" d="M102 0V40H112C136 40 136 0 112 0H102"/>
    <path pathLength="1" style="--i:3" d="M190 0H160V40H190M160 20H183"/>
  </svg></h1>
  <div class="tag"><i></i><span>BROWSE BEYOND</span><i></i></div>
  <div class="priv-note">Private tab. Tide saves no history here, and deletes cookies and site data when you close the last private tab.</div>

  <form id="f" autocomplete="off">
    <div class="sb" id="sb">
      <svg class="s" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M15.5 15.5L20.5 20.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" enterkeyhint="go" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search or type a web address">
      <button class="go" type="submit" aria-label="Go"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5.5l6.5 6.5-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
  </form>

  <div class="tiles" id="tiles"></div>
  <div class="hint">Tap anywhere to finish editing</div>

  <dialog id="dlg">
    <h3>Add shortcut</h3>
    <input id="d-title" placeholder="Name (optional)">
    <input id="d-url" placeholder="example.com" inputmode="url" autocapitalize="off">
    <div class="acts"><button id="d-cancel" type="button">Cancel</button><button class="p" id="d-ok" type="button">Add</button></div>
  </dialog>

  <script>
    const html = document.documentElement;
    let reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.tidePage.isPrivate().then((p) => { if (p) html.classList.add('private'); }).catch(() => {});

    // ---------- starfield and shooting stars ----------
    function startSky(fast) {
      const K = fast ? 0.42 : 1;
      const T = {};
      const readTheme = () => {
        const cs = getComputedStyle(html);
        const g = (n) => cs.getPropertyValue(n).trim();
        T.s1 = g('--star-1'); T.s2 = g('--star-2'); T.shoot = g('--shoot'); T.a = parseFloat(g('--star-alpha')) || 1;
      };
      readTheme();
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', readTheme);
      const cv = document.getElementById('sky');
      const ctx = cv.getContext('2d');
      const dpr = Math.min(devicePixelRatio || 1, 2);
      let W = 0, H = 0;
      const resize = () => { W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
      addEventListener('resize', resize); resize();

      const layers = [
        { n: 80, size: [0.4, 0.9], drift: 0.004 },
        { n: 40, size: [0.7, 1.3], drift: 0.008 },
        { n: 16, size: [1.1, 1.8], drift: 0.014 },
      ].map((L) => ({ ...L, stars: Array.from({ length: L.n }, () => ({
        x: Math.random(), y: Math.random() * 0.85, r: L.size[0] + Math.random() * (L.size[1] - L.size[0]),
        ph: Math.random() * 6.283, sp: 0.6 + Math.random() * 1.8, k: Math.random() < 0.3 ? 1 : 0,
      })) }));
      const shooters = [];
      let nextShot = (3.2 + Math.random() * 2) * K + 1;
      const t0 = performance.now();
      let last = t0;

      function drawStars(t, fade) {
        for (const L of layers) {
          for (const s of L.stars) {
            const al = fade * T.a * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * s.sp + s.ph)));
            const x = ((((s.x - t * L.drift * 0.15) % 1) + 1) % 1) * W;
            ctx.fillStyle = `rgba(${s.k ? T.s2 : T.s1},${al.toFixed(3)})`;
            ctx.beginPath(); ctx.arc(x, s.y * H, s.r, 0, 6.283); ctx.fill();
          }
        }
      }

      if (reduce) { drawStars(0, 1); return; }

      function frame(now) {
        requestAnimationFrame(frame);
        if (document.hidden) { last = now; return; }
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        const t = (now - t0) / 1000;
        ctx.clearRect(0, 0, W, H);
        drawStars(t, Math.min(1, Math.max(0, (t - 0.25 * K) / (1.8 * K))));
        if (t > nextShot) {
          nextShot = t + 3 + Math.random() * 5;
          const sp = Math.max(0.45, W / 1200);
          shooters.push({ x: W * (0.4 + Math.random() * 0.6), y: H * (0.03 + Math.random() * 0.2), vx: -(700 + Math.random() * 500) * sp, vy: (260 + Math.random() * 180) * sp, life: 0 });
        }
        for (let i = shooters.length - 1; i >= 0; i--) {
          const s = shooters[i];
          s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt;
          const a = Math.max(0, 1 - s.life / 1.0);
          if (a <= 0) { shooters.splice(i, 1); continue; }
          const sp = Math.hypot(s.vx, s.vy), len = Math.min(170, W * 0.3), tx2 = s.x - (s.vx / sp) * len, ty2 = s.y - (s.vy / sp) * len;
          const g = ctx.createLinearGradient(s.x, s.y, tx2, ty2);
          g.addColorStop(0, `rgba(${T.shoot},${a})`); g.addColorStop(1, `rgba(${T.shoot},0)`);
          ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(tx2, ty2); ctx.stroke();
          ctx.fillStyle = `rgba(${T.shoot},${a})`; ctx.beginPath(); ctx.arc(s.x, s.y, 1.6, 0, 6.283); ctx.fill();
        }
      }
      requestAnimationFrame(frame);
    }

    // Full intro the first time Tide opens, a faster one after that.
    window.tidePage.introSeen().catch(() => ({ seen: false })).then((r) => {
      const seen = !!(r && r.seen);
      if (r && r.reduce) { reduce = true; html.classList.add('reduce'); }
      if (seen) html.classList.add('fast');
      html.classList.remove('wait');
      startSky(seen);
    });

    // ---------- search ----------
    const q = document.getElementById('q');
    const sb = document.getElementById('sb');
    q.addEventListener('input', () => sb.classList.toggle('has', q.value.trim().length > 0));
    document.getElementById('f').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = q.value.trim();
      if (v) { q.blur(); window.tidePage.navigate(v); }
    });

    // ---------- shortcut tiles ----------
    const DEFAULTS = [
      { title: 'YouTube', url: 'https://www.youtube.com' },
      { title: 'Gmail', url: 'https://mail.google.com' },
      { title: 'Drive', url: 'https://drive.google.com' },
      { title: 'Instagram', url: 'https://www.instagram.com' },
      { title: 'GitHub', url: 'https://github.com' },
      { title: 'Wikipedia', url: 'https://www.wikipedia.org' },
      { title: 'Reddit', url: 'https://www.reddit.com' },
    ];
    let shortcuts = DEFAULTS;
    let firstRender = true;
    let justAdded = -1;
    const tilesEl = document.getElementById('tiles');

    function save() { window.tidePage.setSettings({ shortcuts }); }
    function setEditing(on) { tilesEl.classList.toggle('editing', on); }

    function nameFor(s) {
      if (s.title) return s.title;
      try { return new URL(s.url).hostname.replace(/^www\./, '').split('.')[0]; } catch { return s.url; }
    }

    function render() {
      tilesEl.textContent = '';
      shortcuts.forEach((s, i) => {
        const el = document.createElement('div');
        el.className = 'tile' + (firstRender ? ' intro' : i === justAdded ? ' pop' : '');
        el.style.setProperty('--i', i);
        let host = '';
        try { host = new URL(s.url).hostname; } catch {}
        const face = document.createElement('div');
        face.className = 'face';
        const img = document.createElement('img');
        img.alt = '';
        img.src = `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(host)}`;
        img.onerror = () => { img.replaceWith(Object.assign(document.createElement('span'), { className: 'ltr', textContent: (s.title || host || '?')[0].toUpperCase() })); };
        face.appendChild(img);
        const lbl = document.createElement('div');
        lbl.className = 'lbl'; lbl.textContent = nameFor(s);
        const rm = document.createElement('button');
        rm.className = 'rm'; rm.textContent = '✕'; rm.setAttribute('aria-label', 'Remove');
        rm.onclick = (e) => {
          e.stopPropagation();
          el.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(.2) rotate(20deg)', filter: 'blur(8px)' }], { duration: 280, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' })
            .onfinish = () => { shortcuts.splice(i, 1); justAdded = -1; save(); render(); setEditing(true); };
        };
        el.append(rm, face, lbl);
        el.onclick = (e) => { if (tilesEl.classList.contains('editing')) { e.stopPropagation(); return; } window.tidePage.navigate(s.url); };
        let timer = 0;
        el.addEventListener('touchstart', () => { timer = setTimeout(() => { timer = 0; setEditing(true); if (navigator.vibrate) navigator.vibrate(12); }, 480); }, { passive: true });
        const cancel = () => { if (timer) { clearTimeout(timer); timer = 0; } };
        el.addEventListener('touchend', cancel); el.addEventListener('touchmove', cancel, { passive: true }); el.addEventListener('touchcancel', cancel);
        el.addEventListener('contextmenu', (e) => e.preventDefault());
        tilesEl.appendChild(el);
      });
      if (shortcuts.length < 12) {
        const add = document.createElement('div');
        add.className = 'tile add' + (firstRender ? ' intro' : '');
        add.style.setProperty('--i', shortcuts.length);
        add.innerHTML = '<div class="face"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div><div class="lbl">Add</div>';
        add.onclick = (e) => {
          e.stopPropagation(); setEditing(false);
          document.getElementById('d-title').value = ''; document.getElementById('d-url').value = '';
          document.getElementById('dlg').showModal(); document.getElementById('d-url').focus();
        };
        tilesEl.appendChild(add);
      }
      firstRender = false;
    }
    document.addEventListener('click', (e) => { if (!tilesEl.contains(e.target) || e.target === tilesEl) setEditing(false); });

    document.getElementById('d-cancel').onclick = () => document.getElementById('dlg').close();
    document.getElementById('d-ok').onclick = () => {
      let url = document.getElementById('d-url').value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      try { new URL(url); } catch { return; }
      shortcuts.push({ title: document.getElementById('d-title').value.trim(), url });
      justAdded = shortcuts.length - 1;
      save(); render();
      document.getElementById('dlg').close();
    };

    window.tidePage.getShortcuts().catch(() => null).then((s) => { if (s) shortcuts = s; render(); });
  </script>
</body>
</html>
